<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançar Nota Fiscal - MataoUsi</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/global.css">
</head>

<body>

<header class="topbar">
    <a href="dashboard.html">
        <button class="btn-voltar">⬅ Voltar ao Menu</button>
    </a>

    <h1 class="topbar-title">Lançar Nota Fiscal</h1>
</header>

<div class="container">

    <!-- ============================ -->
    <!--  DADOS GERAIS DA NF -->
    <!-- ============================ -->
    <section class="card">
        <h2 class="card-title">Dados da Nota Fiscal</h2>

        <div class="form-grid">

            <div class="form-group">
                <label for="clienteSelect">Cliente</label>
                <select id="clienteSelect">
                    <option value="">Selecione o cliente</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nfNumero">Número da NF</label>
                <input type="text" id="nfNumero" placeholder="Ex: 5521">
            </div>

            <div class="form-group">
                <label for="nfData">Data da NF</label>
                <input type="date" id="nfData">
            </div>

        </div>
    </section>

    <!-- ============================ -->
    <!--       ITENS DA NF           -->
    <!-- ============================ -->
    <section class="card">
        <h2 class="card-title">Itens da Nota Fiscal</h2>

        <div class="form-grid">

            <div class="form-group">
                <label for="produtoSelect">Produto</label>
                <select id="produtoSelect">
                    <option value="">Selecione o produto</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantidadeNF">Quantidade</label>
                <input type="number" id="quantidadeNF" min="0" step="1" placeholder="Ex: 100">
            </div>

            <div class="form-group" style="display: flex; align-items: flex-end;">
                <button id="btnAdicionarItem" class="btn-secundario" style="width: 100%;">
                    Adicionar Item
                </button>
            </div>

        </div>

        <!-- TABELA CORRIGIDA -->
        <div class="tabela-wrapper" style="margin-top: 16px; overflow-x: auto;">
            <table class="tabela-padrao">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Valor Unitário</th>
                        <th>Quantidade</th>
                        <th>Valor Total</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tbodyItensNF"></tbody>
            </table>
        </div>

        <!-- TOTAL AUTOMÁTICO -->
        <div style="margin-top:20px; text-align:right;">
            <h3>Total da NF: <span id="totalNF">R$ 0,00</span></h3>
        </div>

    </section>

    <!-- ============================ -->
    <!--       BOLETOS              -->
    <!-- ============================ -->
    <section class="card">
        <h2 class="card-title">Boletos / Parcelas</h2>

        <!-- TABELA -->
        <div class="tabela-wrapper" style="margin-top: 16px;">
            <table class="tabela-padrao">
                <thead>
                    <tr>
                        <th>Parcela</th>
                        <th>Valor</th>
                        <th>Vencimento</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tbodyBoletos"></tbody>
            </table>
        </div>

        <!-- BOTÃO AUTOMÁTICO -->
        <div style="margin-top: 16px;">
            <button id="btnGerarParcelas" class="btn-secundario">
                Gerar Parcelas Automáticas
            </button>
        </div>

    </section>

    <!-- ============================ -->
    <!--       BOTÃO SALVAR NF       -->
    <!-- ============================ -->
    <section class="card" style="text-align: right;">
        <button id="btnSalvarNF" class="btn-primario">
            Salvar NF + Boletos + Financeiro
        </button>
    </section>

</div>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/notas_nova.js"></script>

</body>
</html>
