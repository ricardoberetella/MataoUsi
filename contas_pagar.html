<style>
    body { background-color: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 10px; font-size: 14px; }
    .container { max-width: 100%; margin: auto; }
    
    /* Dashboard compacta em linha única */
    .dashboard { 
        display: flex; 
        flex-wrap: nowrap; 
        gap: 8px; 
        margin-bottom: 15px; 
        align-items: stretch;
    }
    .card { 
        background: #1e293b; 
        padding: 10px; 
        border-radius: 8px; 
        text-align: center; 
        border: 1px solid #334155;
        flex: 1;
        min-width: 110px;
    }
    .valor { font-size: 1.1rem; font-weight: bold; margin-top: 4px; }

    /* Container de botões ao lado da aplicação */
    .botoes-topo {
        display: flex;
        flex-direction: column;
        gap: 5px;
        justify-content: center;
    }
    .btn-acao-topo { 
        padding: 6px 12px; 
        border: none; 
        border-radius: 4px; 
        color: white; 
        font-weight: bold; 
        cursor: pointer; 
        font-size: 11px;
        white-space: nowrap;
    }

    /* Modal Compacto */
    .modal-content { 
        background: #1e293b; 
        margin: 5% auto; 
        padding: 15px; 
        width: 90%; 
        max-width: 320px; 
        border-radius: 10px; 
        border: 1px solid #38bdf8; 
    }
    input, select { padding: 8px; margin: 5px 0; font-size: 13px; }
    
    table { font-size: 13px; margin-top: 10px; }
    th, td { padding: 10px 8px; }
</style>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="color: #38bdf8; margin: 0;">Extrato Financeiro</h2>
        <a href="dashboard.html" style="color: #38bdf8; text-decoration: none; border: 1px solid #38bdf8; padding: 5px 10px; border-radius: 4px; font-size: 12px;">← Sair</a>
    </div>

    <div class="dashboard">
        <div class="card"><small>RECEBER</small><div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div></div>
        <div class="card"><small>A PAGAR</small><div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div></div>
        <div class="card"><small>SICOOB</small><div id="resumoSicoob" class="valor" style="color: #38bdf8;">R$ 0,00</div></div>
        <div class="card"><small>CAIXA</small><div id="resumoCaixa" class="valor" style="color: #38bdf8;">R$ 0,00</div></div>
        <div class="card"><small>APLICAÇÃO</small><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
        
        <div class="botoes-topo">
            <button onclick="abrirModal('DEBITO')" class="btn-acao-topo" style="background: #ef4444;">- Débito</button>
            <button onclick="abrirModal('CREDITO')" class="btn-acao-topo" style="background: #22c55e;">+ Crédito</button>
            <button onclick="abrirModal('TRANSFERENCIA')" class="btn-acao-topo" style="background: #a855f7;">Transf.</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>DATA</th><th>BANCO</th><th>DESCRIÇÃO</th><th>VALOR</th><th style="text-align: center;">AÇÕES</th>
            </tr>
        </thead>
        <tbody id="listaFinanceiro"></tbody>
    </table>
</div>
