<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato Financeiro - Matão Usinagem</title>
    <link rel="stylesheet" href="css/contas_pagar.css">
    <style>
        :root { --bg: #020617; --card: #0f172a; --border: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-voltar { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 8px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }

        /* Cards de Saldo */
        .dashboard-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card small { color: #94a3b8; text-transform: uppercase; font-size: 0.7rem; font-weight: bold; }
        .valor { font-size: 1.4rem; font-weight: bold; margin-top: 10px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

        /* Ações e Filtros */
        .acoes-admin { display: flex; gap: 12px; margin-bottom: 20px; }
        .btn-lancar { border: none; padding: 12px 25px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-debito { background: #ef4444; }
        .btn-credito { background: #22c55e; }
        .btn-transf { background: #a855f7; }

        .filter-bar { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; }
        input, select { background: #1e293b; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; }

        /* Tabela */
        .tabela-container { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1e293b; color: var(--accent); padding: 15px; text-align: left; font-size: 0.8rem; }
        td { padding: 15px; border-bottom: 1px solid #1e293b; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .modal-content { background: var(--card); margin: 5% auto; padding: 30px; border: 1px solid var(--accent); width: 400px; border-radius: 15px; box-shadow: 0 0 30px rgba(56, 189, 248, 0.2); }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="color: var(--accent); margin: 0;">Extrato Financeiro</h1>
        <a href="dashboard.html" class="btn-voltar">← Voltar ao Menu</a>
    </div>

    <div class="dashboard-resumo">
        <div class="card"><small>Previsão Receber</small><div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div></div>
        <div class="card"><small>Contas a Pagar</small><div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div></div>
        <div class="card"><small>SICOOB</small><div id="resumoSicoob" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><small>CAIXA</small><div id="resumoCaixa" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
    </div>

    <div class="acoes-admin">
        <button class="btn-lancar btn-debito" onclick="abrirModal('DEBITO')">- Débito</button>
        <button class="btn-lancar btn-credito" onclick="abrirModal('CREDITO')">+ Crédito</button>
        <button class="btn-lancar btn-transf" onclick="abrirModal('TRANSFERENCIA')">Transferência</button>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>BANCO</th>
                    <th>DESCRIÇÃO</th>
                    <th>VALOR</th>
                    <th>STATUS</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="listaFinanceiro"></tbody>
        </table>
    </div>
</div>

<div id="modalFinanceiro" class="modal">
    <div class="modal-content">
        <h2 id="modalTitulo" style="color: var(--accent); margin-top: 0;">Novo Lançamento</h2>
        <input type="hidden" id="tipoLancamento">
        <div class="form-group">
            <label>Banco</label>
            <select id="campoBanco">
                </select>
        </div>
        <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="campoDescricao" placeholder="Ex: Pagamento Fornecedor">
        </div>
        <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" id="campoValor">
        </div>
        <div class="form-group">
            <label>Vencimento</label>
            <input type="date" id="campoVencimento">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="salvarLancamento()" class="btn-filtrar" style="flex:1">SALVAR</button>
            <button onclick="fecharModal()" style="flex:1; background:#334155; color:white; border:none; border-radius:6px; cursor:pointer;">CANCELAR</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>
</body>
</html>
