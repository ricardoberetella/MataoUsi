<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contas a Pagar - Matão Usinagem</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        body { background: #020617; color: white; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        .btn-voltar-menu { display: inline-flex; align-items: center; padding: 8px 16px; border: 1px solid #38bdf8; border-radius: 8px; color: #38bdf8; text-decoration: none; margin-bottom: 20px; transition: 0.3s; }
        .btn-voltar-menu:hover { background: rgba(56, 189, 248, 0.1); }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 30px; }
        
        .filter-bar {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
            border: 1px solid #1e293b;
        }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 0.8rem; color: #38bdf8; font-weight: bold; }
        .filter-bar input, .filter-bar select { 
            background: #1e293b; border: 1px solid #334155; color: white; 
            padding: 8px; border-radius: 6px; outline: none;
        }

        .flex-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tabela { width: 100%; border-collapse: collapse; background: #0f172a; border-radius: 8px; overflow: hidden; }
        .tabela th { background: #1e293b; color: #38bdf8; text-align: left; padding: 15px; border-bottom: 2px solid #38bdf8; }
        .tabela td { padding: 15px; border-bottom: 1px solid #334155; }
        
        .btn { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-verde { background: #22c55e; color: white; }
        .btn-azul { background: #38bdf8; color: black; }
        .btn-roxo { background: #8b5cf6; color: white; }
        .btn-amarelo { background: #f39c12; color: white; }
        .btn-vermelho { background: #ef4444; color: white; }
        .btn-cinza { background: #475569; color: white; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #0f172a; padding: 30px; border-radius: 12px; border: 2px solid #38bdf8; width: 400px; }
        .modal input, .modal select { width: 100%; margin-top: 12px; padding: 10px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-voltar-menu">← Voltar ao Menu</a>
    <h1>Financeiro</h1>

    <div class="filter-bar">
        <div class="filter-group">
            <label>Data Início</label>
            <input type="date" id="filtroDataInicio">
        </div>
        <div class="filter-group">
            <label>Data Fim</label>
            <input type="date" id="filtroDataFim">
        </div>
        <div class="filter-group">
            <label>Banco</label>
            <select id="filtroBanco">
                <option value="">Todos os Bancos</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Status</label>
            <select id="filtroStatus">
                <option value="ABERTO" selected>ABERTO</option>
                <option value="PAGO">PAGO</option>
                <option value="">TODOS</option>
            </select>
        </div>
        <button onclick="carregarContas()" class="btn btn-azul">Filtrar</button>
        <button onclick="limparFiltros()" class="btn">Limpar</button>
    </div>

    <div class="flex-buttons">
        <button id="btnNovoPagar" class="btn btn-verde">Novo Lançamento</button>
        <button id="btnTransferir" class="btn btn-roxo">Transferência</button>
        <button id="btnNfEntrada" class="btn btn-azul">NF Entrada</button>
    </div>

    <table class="tabela">
        <thead>
            <tr>
                <th>Data</th>
                <th>Banco</th>
                <th>Descrição</th>
                <th>Entrada</th>
                <th>Saída</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="listaPagar"></tbody>
    </table>
</div>

<div id="modalNovoPagar" class="modal">
    <div class="modal-content">
        <h3>Novo Lançamento</h3>
        <select id="novoBanco"></select>
        <input id="novoDescricao" type="text" placeholder="Descrição">
        <input id="novoValor" type="text" placeholder="Valor (Ex: 150,00)">
        <input type="date" id="novoVencimento">
        <div class="modal-actions">
            <button onclick="fecharModais()" class="btn">Cancelar</button>
            <button id="btnSalvarNovoPagar" class="btn btn-verde">Salvar</button>
        </div>
    </div>
</div>

<div id="modalEditarPagar" class="modal">
    <div class="modal-content">
        <h3>Editar Lançamento</h3>
        <input type="hidden" id="editId">
        <select id="editBanco"></select>
        <input id="editDescricao" type="text" placeholder="Descrição">
        <input id="editValor" type="text" placeholder="Valor">
        <input type="date" id="editVencimento">
        <select id="editStatus">
            <option value="ABERTO">ABERTO</option>
            <option value="PAGO">PAGO</option>
        </select>
        <div class="modal-actions">
            <button onclick="fecharModais()" class="btn">Cancelar</button>
            <button id="btnAtualizarPagar" class="btn btn-verde">Atualizar</button>
        </div>
    </div>
</div>

</body>
</html>
