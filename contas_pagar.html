<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Extrato Financeiro</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:radial-gradient(circle at top,#0b1224,#020617 70%);
color:white;
}

.container{
max-width:1200px;
margin:auto;
padding:30px;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

h1{
color:#38bdf8;
margin:0;
}

.btn-voltar{
background:#020617;
border:1px solid #38bdf8;
color:#38bdf8;
padding:8px 18px;
border-radius:8px;
cursor:pointer;
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
text-align:center;
}

.card h3{
font-size:14px;
color:#94a3b8;
margin-bottom:10px;
}

.card span{
font-size:22px;
font-weight:bold;
}

.receber{color:#22c55e}
.pagar{color:#ef4444}
.aplicacao{color:#a855f7}

.filtros{
display:flex;
gap:20px;
margin-bottom:20px;
align-items:center;
}

select{
padding:10px;
border-radius:8px;
border:none;
background:#020617;
color:white;
}

button{
cursor:pointer;
}

.tabela{
width:100%;
border-collapse:collapse;
}

.tabela th{
text-align:left;
color:#38bdf8;
padding:10px;
border-bottom:2px solid #334155;
}

.tabela td{
padding:10px;
border-bottom:1px solid #334155;
}

.hidden{
display:none;
}

.btn-tabela{
padding:4px 8px;
border:none;
border-radius:6px;
cursor:pointer;
}

.btn-pagar{background:#22c55e}
.btn-estornar{background:#f59e0b}
.btn-editar{background:#38bdf8}
.btn-excluir{background:#ef4444}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

.modal-content{
background:#020617;
padding:30px;
border-radius:10px;
max-width:500px;
margin:80px auto;
}

input,select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
}

</style>

</head>

<body>

<div class="container">

<div class="topo">

<h1>Extrato Financeiro</h1>

<button class="btn-voltar" onclick="window.location.href='dashboard.html'">
← Voltar
</button>

</div>

<div class="cards">

<div class="card">
<h3>RECEBER</h3>
<span id="resumoReceber" class="receber">R$ 0,00</span>
</div>

<div class="card">
<h3>A PAGAR</h3>
<span id="resumoPagar" class="pagar">R$ 0,00</span>
</div>

<div class="card">
<h3>SICOOB</h3>
<span id="resumoSicoob">R$ 0,00</span>
</div>

<div class="card">
<h3>CAIXA</h3>
<span id="resumoCaixa">R$ 0,00</span>
</div>

<div class="card">
<h3>APLICAÇÃO</h3>
<span id="resumoAplicacao" class="aplicacao">R$ 0,00</span>
</div>

</div>

<div class="filtros">

<div>
<label>Mês</label>
<select id="filtroMes">
<option value="1">Janeiro</option>
<option value="2">Fevereiro</option>
<option value="3">Março</option>
<option value="4">Abril</option>
<option value="5">Maio</option>
<option value="6">Junho</option>
<option value="7">Julho</option>
<option value="8">Agosto</option>
<option value="9">Setembro</option>
<option value="10">Outubro</option>
<option value="11">Novembro</option>
<option value="12">Dezembro</option>
</select>
</div>

<div>
<label>Ano</label>
<select id="filtroAno"></select>
</div>

<button onclick="limparFiltroMesAno()">Mês Atual</button>

</div>

<table class="tabela">

<thead>

<tr>

<th>DATA</th>
<th>BANCO</th>
<th>DESCRIÇÃO</th>
<th>VALOR</th>
<th>STATUS</th>
<th id="colunaAcoes">AÇÕES</th>

</tr>

</thead>

<tbody id="listaFinanceiro"></tbody>

</table>

</div>

<!-- MODAL -->

<div id="modalFinanceiro" class="modal">

<div class="modal-content">

<h2 id="modalTitulo">NOVO</h2>

<input type="hidden" id="editId">

<label>Data</label>
<input type="date" id="campoData">

<label>Banco</label>
<select id="campoBanco"></select>

<label>Descrição</label>
<input id="campoDescricao">

<label>Valor</label>
<input id="campoValor" type="number">

<button onclick="salvarLancamento()">Salvar</button>

<button onclick="fecharModais()">Cancelar</button>

</div>

</div>

<!-- JS -->

<script type="module" src="js/contas_pagar.js"></script>

</body>
</html>
