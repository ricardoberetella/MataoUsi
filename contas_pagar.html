
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de Caixa / Extrato - Matão Usinagem</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --border: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Topo e Botão Voltar (Conforme Imagem 10) */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-voltar { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 8px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-voltar:hover { background: rgba(56, 189, 248, 0.1); }

        /* Dashboard de Cards (Conforme Imagem 4 e 11) */
        .dashboard-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; text-align: center; }
        .card small { color: #94a3b8; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px; font-weight: bold; }
        .valor { font-size: 1.4rem; font-weight: bold; margin-top: 10px; }

        /* Filtros (Conforme Imagem 11) */
        .filter-bar { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 0.75rem; color: var(--accent); font-weight: bold; }
        input, select { background: #1e293b; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; outline: none; }
        .btn-filtrar { background: var(--accent); color: #020617; border: none; padding: 10px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Botões de Lançamento (Conforme Imagem 8 e 9) */
        .acoes-admin { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-lancar { border: none; padding: 12px 25px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-debito { background: #ef4444; }
        .btn-credito { background: #22c55e; }
        .btn-transf { background: #a855f7; }

        /* Tabela Estilizada (Conforme Imagem 6 e 7) */
        .tabela-container { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1e293b; color: var(--accent); padding: 15px; text-align: left; font-size: 0.8rem; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid #1e293b; font-size: 0.9rem; }
        .btn-tab { border: none; padding: 5px 10px; border-radius: 4px; color: white; cursor: pointer; font-size: 0.75rem; font-weight: bold; margin-right: 5px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="color: var(--accent); margin: 0;">Fluxo de Caixa / Extrato</h1>
        <a href="dashboard.html" class="btn-voltar">← Voltar ao Menu</a>
    </div>

    <div class="dashboard-resumo">
        <div class="card"><small>Previsão Receber</small><div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div></div>
        <div class="card"><small>Contas a Pagar</small><div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div></div>
        <div class="card"><small>SICOOB</small><div id="resumoSicoob" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><small>CAIXA</small><div id="resumoCaixa" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><small>Aplicação</small><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
    </div>

    <div class="filter-bar">
        <div class="filter-group"><label>INÍCIO</label><input type="date" id="fDataInicio"></div>
        <div class="filter-group"><label>FIM</label><input type="date" id="fDataFim"></div>
        <div class="filter-group">
            <label>STATUS</label>
            <select id="fStatus">
                <option value="">TODOS</option>
                <option value="ABERTO">ABERTO</option>
                <option value="PAGO">PAGO</option>
            </select>
        </div>
        <button onclick="carregarTudo()" class="btn-filtrar">FILTRAR</button>
    </div>

    <div class="acoes-admin">
        <button class="btn-lancar btn-debito" onclick="abrirModal('DEBITO')">- Débito</button>
        <button class="btn-lancar btn-credito" onclick="abrirModal('CREDITO')">+ Crédito</button>
        <button class="btn-lancar btn-transf" onclick="abrirModal('TRANSFERENCIA')">Transf.</button>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>BANCO</th>
                    <th>DESCRIÇÃO</th>
                    <th>ENTRADA</th>
                    <th>SAÍDA</th>
                    <th>STATUS</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="listaFinanceiro"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>
</body>
</html>
