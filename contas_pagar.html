<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contas a Pagar</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/dashboard.css">

<style>

body{
background:#020617;
color:white;
font-family:Segoe UI;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

h1{
color:#38bdf8;
text-align:center;
}

.tabela{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

.tabela th{
border-bottom:2px solid #38bdf8;
padding:10px;
}

.tabela td{
border-bottom:1px solid #334155;
padding:10px;
}

.valor-entrada{
color:#22c55e;
font-weight:bold;
}

.valor-saida{
color:#ef4444;
font-weight:bold;
}

.btn{
padding:8px 14px;
border-radius:8px;
border:none;
cursor:pointer;
font-weight:bold;
}

.btn-verde{
background:#22c55e;
color:white;
}

.btn-azul{
background:#38bdf8;
color:black;
}

.btn-roxo{
background:#8b5cf6;
color:white;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
align-items:center;
justify-content:center;
}

.modal-content{
background:#0f172a;
padding:20px;
border-radius:10px;
border:2px solid #38bdf8;
width:400px;
}

.modal input,
.modal select{
width:100%;
margin-top:10px;
padding:8px;
background:#1e293b;
border:1px solid #334155;
color:white;
border-radius:6px;
}

.modal button{
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>Financeiro</h1>

<button id="btnNovoPagar" class="btn btn-verde">Novo Lançamento</button>
<button id="btnTransferir" class="btn btn-roxo">Transferência</button>
<button id="btnNfEntrada" class="btn btn-azul">NF Entrada</button>

<table class="tabela">

<thead>
<tr>
<th>Data</th>
<th>Banco</th>
<th>Descrição</th>
<th>Entrada</th>
<th>Saída</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="listaPagar"></tbody>

</table>

</div>

<!-- NOVO LANÇAMENTO -->

<div id="modalNovoPagar" class="modal">

<div class="modal-content">

<h3>Novo Lançamento</h3>

<select id="novoBanco"></select>

<input id="novoDescricao" placeholder="Descrição">

<input id="novoValor" placeholder="Valor">

<input type="date" id="novoVencimento">

<button id="btnSalvarNovoPagar" class="btn btn-verde">Salvar</button>

<button id="btnCancelarNovoPagar" class="btn">Cancelar</button>

</div>
</div>

<!-- NF ENTRADA -->

<div id="modalNfEntrada" class="modal">

<div class="modal-content">

<h3>NF Entrada</h3>

<select id="nfBanco"></select>

<input id="nfDescricao" placeholder="Descrição">

<input id="nfValor" placeholder="Valor">

<input type="date" id="nfVencimento">

<button id="btnSalvarNfEntrada" class="btn btn-verde">Salvar</button>

<button id="btnCancelarNfEntrada" class="btn">Cancelar</button>

</div>
</div>

<!-- TRANSFERENCIA -->

<div id="modalTransferencia" class="modal">

<div class="modal-content">

<h3>Transferência</h3>

<select id="transferBancoOrigem"></select>

<select id="transferBancoDestino"></select>

<input id="transferDescricao" placeholder="Descrição">

<input id="transferValor" placeholder="Valor">

<input type="date" id="transferData">

<button id="btnSalvarTransferencia" class="btn btn-verde">Transferir</button>

<button id="btnCancelarTransferencia" class="btn">Cancelar</button>

</div>
</div>
