<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato Financeiro - Matão Usinagem</title>
    <link rel="stylesheet" href="css/contas_pagar.css">
    <style>
        /* Estilo do Botão Voltar conforme Print 1 */
        .btn-voltar-topo {
            background: transparent;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .btn-voltar-topo:hover { background: rgba(56, 189, 248, 0.1); }

        /* Botões de Ação do Administrador */
        .acoes-admin-topo { display: flex; gap: 10px; margin: 20px 0; }
        .btn-topo { border: none; padding: 10px 20px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-debito { background-color: #ef4444; } /* Vermelho */
        .btn-credito { background-color: #22c55e; } /* Verde */
        .btn-transf { background-color: #a855f7; } /* Roxo */
        .btn-topo:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="color: #38bdf8; margin: 0;">Fluxo de Caixa / Extrato</h2>
        <a href="dashboard.html" class="btn-voltar-topo">← Voltar ao Menu</a>
    </div>

    <div class="filter-bar">
        <div class="filter-group"><label>DATA INÍCIO</label><input type="date" id="fDataInicio"></div>
        <div class="filter-group"><label>DATA FIM</label><input type="date" id="fDataFim"></div>
        <div class="filter-group">
            <label>STATUS</label>
            <select id="fStatus">
                <option value="">TODOS</option>
                <option value="ABERTO">ABERTO</option>
                <option value="PAGO">PAGO</option>
            </select>
        </div>
        <button onclick="carregarTudo()" class="btn-filtrar">FILTRAR</button>
    </div>

    <div class="acoes-admin-topo">
        <button class="btn-topo btn-debito" onclick="abrirModal('DEBITO')">- Débito (Saída)</button>
        <button class="btn-topo btn-credito" onclick="abrirModal('CREDITO')">+ Crédito (Entrada)</button>
        <button class="btn-topo btn-transf" onclick="abrirModal('TRANSFERENCIA')">Transferência</button>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>BANCO</th>
                    <th>DESCRIÇÃO</th>
                    <th>ENTRADA</th>
                    <th>SAÍDA</th>
                    <th>STATUS</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="listaFinanceiro">
                </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>
</body>
</html>
