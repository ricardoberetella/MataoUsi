<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Extrato Financeiro - Matão Usinagem</title>
    <style>
        :root {
            --bg-dark: #0b1120;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
        }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: auto; }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-voltar { color: var(--primary); text-decoration: none; border: 1px solid var(--primary); padding: 10px 20px; border-radius: 8px; font-size: 14px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .card small { color: #94a3b8; font-weight: bold; font-size: 11px; text-transform: uppercase; display: block; margin-bottom: 8px; }
        .valor { font-size: 1.4rem; font-weight: 800; }
        .area-botoes { display: flex; gap: 12px; margin-bottom: 25px; }
        .btn-acao { flex: 1; padding: 18px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .tabela-container { background: var(--card-bg); border-radius: 12px; overflow-x: auto; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #0f172a; padding: 15px; text-align: left; color: var(--primary); font-size: 12px; }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .btn-tabela { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: bold; color: white; margin-right: 5px; }
        .btn-pagar { background: var(--success); }
        .btn-estornar { background: var(--warning); }
        .btn-editar { background: var(--primary); }
        .btn-excluir { background: var(--danger); }
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); }
        .modal-content { background: var(--card-bg); margin: 5% auto; padding: 25px; width: 95%; max-width: 380px; border-radius: 15px; border: 1px solid var(--primary); box-sizing: border-box; }
        .modal-content input, .modal-content select { width: 100%; padding: 14px; margin-top: 10px; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn-salvar { width: 100%; padding: 16px; background: var(--primary); border: none; color: #0f172a; font-weight: bold; border-radius: 8px; margin-top: 25px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-area">
            <h1 style="color: var(--primary); margin: 0;">Extrato Financeiro</h1>
            <a href="dashboard.html" class="btn-voltar">← Voltar</a>
        </div>

        <div class="dashboard">
            <div class="card"><small>Previsão Receber</small><div id="resumoReceber" class="valor" style="color: var(--success);">R$ 0,00</div></div>
            <div class="card"><small>A Pagar (Pendente)</small><div id="resumoPagar" class="valor" style="color: var(--danger);">R$ 0,00</div></div>
            <div class="card"><small>SICOOB</small><div id="resumoSicoob" class="valor">R$ 0,00</div></div>
            <div class="card"><small>CAIXA FEDERAL</small><div id="resumoCaixa" class="valor">R$ 0,00</div></div>
            <div class="card"><small>APLICAÇÃO</small><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
        </div>

        <div class="area-botoes">
            <button onclick="abrirModal('LANÇAR DEBITO')" class="btn-acao" style="background: var(--danger);">- Débito</button>
            <button onclick="abrirModal('LANÇAR CREDITO')" class="btn-acao" style="background: var(--success);">+ Crédito</button>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr><th>DATA</th><th>BANCO</th><th>DESCRIÇÃO</th><th>VALOR</th><th>STATUS</th><th style="text-align: center;">AÇÕES</th></tr>
                </thead>
                <tbody id="listaFinanceiro"></tbody>
            </table>
        </div>
    </div>

    <div id="modalFinanceiro" class="modal">
        <div class="modal-content">
            <h2 id="modalTitulo" style="margin-top: 0; color: var(--primary);">Lançar</h2>
            <input type="hidden" id="editId">
            <input type="date" id="campoData" onclick="this.showPicker()">
            <select id="campoBanco"></select>
            <input type="text" id="campoDescricao" placeholder="Descrição">
            <input type="number" step="0.01" id="campoValor" placeholder="0,00">
            <button onclick="salvarLancamento()" class="btn-salvar">SALVAR AGENDAMENTO</button>
            <button onclick="fecharModais()" style="width:100%; background:none; border:none; color:#94a3b8; margin-top:15px; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/contas_pagar.js"></script>
</body>
</html>
