<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contas a Pagar - Matão Usinagem</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/dashboard.css">

<style>
.page-wrap{
max-width:1100px;
margin:10px auto;
padding:0 12px 20px;
}

.container{
width:100%;
padding:18px;
border-radius:16px;
background:rgba(2,6,23,.95);
border:1px solid rgba(56,189,248,.35);
box-shadow:0 0 15px rgba(56,189,248,.15);
}

.topo-contas-pagar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
flex-wrap:wrap;
gap:10px;
}

.titulo-contas-pagar{
color:#38bdf8;
font-size:24px;
margin:0;
flex:1;
text-align:center;
}

.btn-voltar-topo{
background:transparent;
color:#38bdf8;
border:2px solid #38bdf8;
border-radius:12px;
padding:8px 16px;
font-weight:700;
font-size:14px;
cursor:pointer;
transition:.2s;
white-space:nowrap;
}

.btn-voltar-topo:hover{
background:rgba(56,189,248,.08);
}

.cards-bancos{
display:flex;
gap:10px;
margin-bottom:15px;
flex-wrap:wrap;
}

.bloco-filtros{
background:rgba(30,41,59,.65);
padding:14px;
border-radius:12px;
}

.filtros-linha{
display:flex;
flex-direction:column;
gap:12px;
}

.campos-linha{
display:grid;
grid-template-columns:repeat(5, minmax(0, 1fr));
gap:12px;
align-items:end;
}

.botoes-linha{
display:flex;
justify-content:flex-end;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.campo-filtro{
display:flex;
flex-direction:column;
gap:4px;
min-width:0;
}

.campo-filtro input,
.campo-filtro select,
.campo-filtro textarea{
width:100%;
min-width:0;
padding:8px 10px;
border-radius:8px;
background:#1e293b;
color:white;
border:1px solid #334155;
height:38px;
font-size:14px;
box-sizing:border-box;
}

.campo-filtro textarea{
height:90px;
resize:vertical;
}

.btn-acao{
cursor:pointer;
border:none;
padding:0 16px;
border-radius:8px;
font-weight:bold;
color:white;
height:38px;
font-size:14px;
white-space:nowrap;
}

.label-futuro{
color:#38bdf8;
font-size:.70rem;
letter-spacing:1px;
text-transform:uppercase;
}

.tabela-wrapper{
margin-top:15px;
overflow-x:auto;
}

.tabela-pagar{
width:100%;
border-collapse:collapse;
min-width:1000px;
}

.tabela-pagar thead tr{
border-bottom:2px solid #38bdf8;
color:#38bdf8;
}

.tabela-pagar th,
.tabela-pagar td{
padding:10px;
font-size:14px;
}

.tabela-pagar tbody tr{
border-bottom:1px solid rgba(148,163,184,.18);
}

.valor-entrada{
color:#22c55e;
font-weight:bold;
}

.valor-saida{
color:#ef4444;
font-weight:bold;
}

.modal-financeiro{
position:fixed;
inset:0;
background:rgba(0,0,0,.82);
display:none;
align-items:center;
justify-content:center;
z-index:1000;
padding:20px;
}

.modal-financeiro.ativo{
display:flex;
}

.modal-content{
background:#0f172a;
border:2px solid #38bdf8;
padding:22px;
border-radius:14px;
width:100%;
max-width:520px;
color:white;
box-shadow:0 0 24px rgba(56,189,248,.18);
}

.titulo-modal{
margin:0 0 14px;
font-size:22px;
color:#38bdf8;
}

.modal-content input,
.modal-content select,
.modal-content textarea{
width:100%;
padding:10px;
margin:8px 0 0;
background:#1e293b;
border:1px solid #334155;
color:white;
border-radius:8px;
box-sizing:border-box;
font-size:14px;
}

.modal-content textarea{
min-height:90px;
resize:vertical;
}

.acoes-modal{
display:flex;
gap:10px;
margin-top:16px;
justify-content:flex-end;
flex-wrap:wrap;
}

.btn-modal{
cursor:pointer;
border:none;
padding:10px 16px;
border-radius:8px;
font-weight:700;
font-size:14px;
color:#fff;
}

.btn-cancelar{
background:#475569;
}

.btn-salvar{
background:#10b981;
}

.grid-2{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.msg-modal{
margin-top:10px;
font-size:13px;
min-height:18px;
color:#94a3b8;
}

@media (max-width:1000px){
.campos-linha{
grid-template-columns:repeat(3, minmax(0, 1fr));
}
}

@media (max-width:700px){
.campos-linha{
grid-template-columns:repeat(2, minmax(0, 1fr));
}

.grid-2{
grid-template-columns:1fr;
}
}

@media (max-width:520px){
.campos-linha{
grid-template-columns:1fr;
}

.botoes-linha{
justify-content:stretch;
}

.btn-acao{
width:100%;
}

.modal-content{
padding:16px;
}
}
</style>
</head>

<body>

<div class="page-wrap">
<div class="container">

<header class="topo-contas-pagar">
<a href="dashboard.html">
<button class="btn-voltar-topo">← Voltar ao Menu</button>
</a>

<h1 class="titulo-contas-pagar">FINANCEIRO</h1>

<div style="width:120px;"></div>
</header>

<div id="cardsBancos" class="cards-bancos"></div>

<div class="bloco-filtros">
<div class="filtros-linha">

<div class="campos-linha">
<div class="campo-filtro">
<label class="label-futuro">Banco</label>
<select id="filtroBanco">
<option value="">Todos</option>
</select>
</div>

<div class="campo-filtro">
<label class="label-futuro">Data exata</label>
<input type="date" id="filtroData">
</div>

<div class="campo-filtro">
<label class="label-futuro">Mês</label>
<input type="month" id="filtroMes">
</div>

<div class="campo-filtro">
<label class="label-futuro">Status</label>
<select id="filtroStatus">
<option value="ABERTO">Não pagos</option>
<option value="PAGO">Pagos</option>
<option value="TODOS">Todos</option>
</select>
</div>

<div class="campo-filtro">
<label class="label-futuro">Tipo</label>
<select id="filtroTipo">
<option value="TODOS">Todos</option>
<option value="SAIDA">Despesas</option>
<option value="ENTRADA">NF Entrada</option>
</select>
</div>
</div>

<div class="botoes-linha">
<button id="btnTransferir" class="btn-acao" style="background:#8b5cf6;">Transferências</button>
<button id="btnFiltrar" class="btn-acao" style="background:#38bdf8;">Filtrar</button>
<button id="btnLimparFiltros" class="btn-acao" style="background:#475569;">Limpar</button>
<button id="btnNovoPagar" class="btn-acao" style="background:#10b981;">+ Novo Lançamento</button>
<button id="btnNfEntrada" class="btn-acao" style="background:#06b6d4;">NF Entrada</button>
</div>

</div>
</div>

<div class="tabela-wrapper">
<table class="tabela-pagar">
<thead>
<tr>
<th>Data</th>
<th>Banco</th>
<th>Descrição</th>
<th>Entrada</th>
<th>Saída</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="listaPagar"></tbody>
</table>
</div>

</div>
</div>

<!-- MODAL NOVO LANÇAMENTO -->
<div id="modalNovoPagar" class="modal-financeiro">
  <div class="modal-content">
    <h2 class="titulo-modal">Novo Lançamento</h2>

    <div class="campo-filtro">
      <label class="label-futuro">Banco</label>
      <select id="novoBanco"></select>
    </div>

    <div class="campo-filtro">
      <label class="label-futuro">Descrição</label>
      <input type="text" id="novoDescricao" placeholder="Digite a descrição">
    </div>

    <div class="grid-2">
      <div class="campo-filtro">
        <label class="label-futuro">Valor</label>
        <input type="text" id="novoValor" placeholder="0,00" oninput="validarMoeda(this)">
      </div>

      <div class="campo-filtro">
        <label class="label-futuro">Vencimento</label>
        <input type="date" id="novoVencimento">
      </div>
    </div>

    <div class="grid-2">
      <div class="campo-filtro">
        <label class="label-futuro">Status</label>
        <select id="novoStatus">
          <option value="ABERTO">Não pago</option>
          <option value="PAGO">Pago</option>
        </select>
      </div>

      <div class="campo-filtro">
        <label class="label-futuro">Tipo</label>
        <select id="novoTipo">
          <option value="SAIDA">Despesa</option>
          <option value="ENTRADA">NF Entrada</option>
        </select>
      </div>
    </div>

    <div id="msgNovoPagar" class="msg-modal"></div>

    <div class="acoes-modal">
      <button id="btnCancelarNovoPagar" class="btn-modal btn-cancelar">Cancelar</button>
      <button id="btnSalvarNovoPagar" class="btn-modal btn-salvar">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL NF ENTRADA -->
<div id="modalNfEntrada" class="modal-financeiro">
  <div class="modal-content">
    <h2 class="titulo-modal">NF Entrada</h2>

    <div class="campo-filtro">
      <label class="label-futuro">Banco</label>
      <select id="nfBanco"></select>
    </div>

    <div class="campo-filtro">
      <label class="label-futuro">Descrição</label>
      <input type="text" id="nfDescricao" placeholder="Ex.: NF entrada">
    </div>

    <div class="grid-2">
      <div class="campo-filtro">
        <label class="label-futuro">Valor</label>
        <input type="text" id="nfValor" placeholder="0,00" oninput="validarMoeda(this)">
      </div>

      <div class="campo-filtro">
        <label class="label-futuro">Data</label>
        <input type="date" id="nfVencimento">
      </div>
    </div>

    <div class="campo-filtro">
      <label class="label-futuro">Status</label>
      <select id="nfStatus">
        <option value="ABERTO">Não pago</option>
        <option value="PAGO">Pago</option>
      </select>
    </div>

    <div id="msgNfEntrada" class="msg-modal"></div>

    <div class="acoes-modal">
      <button id="btnCancelarNfEntrada" class="btn-modal btn-cancelar">Cancelar</button>
      <button id="btnSalvarNfEntrada" class="btn-modal btn-salvar">Salvar NF</button>
    </div>
  </div>
</div>

</body>
</html>
