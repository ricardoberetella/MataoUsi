<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de Caixa - Matão Usinagem</title>
    <style>
        :root { 
            --bg: #020617; 
            --card: #0f172a; 
            --border: #1e293b; 
            --accent: #38bdf8; 
            --text: #f8fafc; 
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
        }
        .container { max-width: 1200px; margin: auto; }
        
        /* Dashboard de Resumo */
        .dashboard-resumo { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        .card { 
            background: var(--card); 
            border: 1px solid var(--border); 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card small { color: #94a3b8; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; font-weight: bold; }
        .valor { font-size: 1.25rem; font-weight: bold; margin-top: 8px; }

        /* Ações e Filtros */
        .acoes-topo { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            flex-wrap: wrap; 
            gap: 15px;
        }
        .btn-grupo { display: flex; gap: 10px; }
        .btn { 
            border: none; 
            padding: 12px 24px; 
            border-radius: 8px; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: opacity 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .btn:hover { opacity: 0.9; }
        .btn-debito { background: var(--danger); }
        .btn-credito { background: var(--success); }
        .btn-voltar { background: transparent; border: 1px solid var(--accent); color: var(--accent); }

        /* Tabela */
        .tabela-container { 
            background: var(--card); 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            overflow: hidden; 
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #1e293b; color: var(--accent); padding: 15px; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #1e293b; font-size: 0.9rem; }
        
        /* Status */
        .status-pendente { color: var(--warning); font-weight: bold; }
        .status-pago { color: var(--success); font-weight: bold; }

        /* Botões de Ação na Tabela */
        .btn-acao { 
            background: #1e293b; 
            border: 1px solid var(--border); 
            color: white; 
            padding: 6px 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-right: 5px;
            font-size: 0.75rem;
        }
        .btn-acao:hover { border-color: var(--accent); }

        /* Modal */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(4px); 
        }
        .modal-content { 
            background: var(--card); 
            margin: 10% auto; 
            padding: 30px; 
            width: 380px; 
            border-radius: 16px; 
            border: 1px solid var(--accent); 
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--accent); font-weight: bold; font-size: 0.85rem; }
        input, select { 
            width: 100%; 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: white; 
            padding: 12px; 
            border-radius: 8px; 
            box-sizing: border-box; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="acoes-topo">
        <h1 style="margin: 0; color: var(--accent);">Extrato Financeiro</h1>
        <a href="dashboard.html" class="btn btn-voltar">← Voltar ao Menu</a>
    </div>

    <div class="dashboard-resumo">
        <div class="card"><small>SICOOB</small><div id="resumoSicoob" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><small>CAIXA FEDERAL</small><div id="resumoCaixa" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><small>APLICAÇÃO</small><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
        <div class="card"><small>Previsão Receber</small><div id="resumoReceber" class="valor" style="color: var(--success);">R$ 0,00</div></div>
        <div class="card"><small>Contas a Pagar</small><div id="resumoPagar" class="valor" style="color: var(--danger);">R$ 0,00</div></div>
    </div>

    <div class="acoes-topo">
        <div class="btn-grupo">
            <button class="btn btn-debito" onclick="abrirModal('DEBITO')">- Débito (Saída)</button>
            <button class="btn btn-credito" onclick="abrirModal('CREDITO')">+ Crédito (Entrada)</button>
        </div>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Banco</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaFinanceiro">
                </tbody>
        </table>
    </div>
</div>

<div id="modalFinanceiro" class="modal">
    <div class="modal-content">
        <h2 id="modalTitulo" style="color: var(--accent); margin-top: 0;">Lançar</h2>
        <input type="hidden" id="editId"> <div class="form-group">
            <label>DATA</label>
            <input type="date" id="campoData">
        </div>
        <div class="form-group">
            <label>BANCO</label>
            <select id="campoBanco">
                </select>
        </div>
        <div class="form-group">
            <label>DESCRIÇÃO</label>
            <input type="text" id="campoDescricao" placeholder="Ex: Pagamento Fornecedor">
        </div>
        <div class="form-group">
            <label>VALOR (R$)</label>
            <input type="number" step="0.01" id="campoValor" placeholder="0,00">
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 25px;">
            <button onclick="salvarLancamento()" class="btn btn-credito" style="flex: 1;">SALVAR</button>
            <button onclick="fecharModal()" class="btn" style="flex: 1; background: #334155;">CANCELAR</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>

</body>
</html>
