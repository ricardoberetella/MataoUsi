<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro - Matão Usinagem</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --border: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 100%; margin: auto; }
        
        /* Dashboard Compacto */
        .dashboard-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 10px; border-radius: 8px; text-align: center; }
        .card h4 { margin: 0 0 5px 0; font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; }
        .valor { font-size: 0.95rem; font-weight: bold; }
        
        /* Filtros */
        .filter-bar { background: var(--card); padding: 12px; border-radius: 10px; border: 1px solid var(--border); display: flex; gap: 8px; margin-bottom: 15px; align-items: end; flex-wrap: wrap; }
        .filter-group { flex: 1; min-width: 110px; }
        .filter-group label { display: block; font-size: 0.6rem; color: var(--accent); margin-bottom: 3px; font-weight: bold; }
        .filter-bar input, .filter-bar select { background: #1e293b; border: 1px solid #334155; color: white; padding: 6px; border-radius: 6px; width: 100%; font-size: 0.75rem; }

        /* Tabela Ultra-Compacta */
        .tabela-container { background: var(--card); border-radius: 10px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 950px; table-layout: fixed; }
        
        th { background: #1e293b; color: var(--accent); padding: 10px; text-align: left; font-size: 0.7rem; border-bottom: 2px solid var(--accent); }
        td { padding: 8px 6px; border-bottom: 1px solid #334155; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Larguras das Colunas */
        th:nth-child(1) { width: 80px; }  /* Data */
        th:nth-child(2) { width: 90px; }  /* Banco */
        th:nth-child(3) { width: auto; }  /* Descrição */
        th:nth-child(4) { width: 90px; }  /* Entrada */
        th:nth-child(5) { width: 90px; }  /* Saída */
        th:nth-child(6) { width: 80px; }  /* Status */
        th:nth-child(7) { width: 200px; } /* Ações */

        .celula-acoes { display: flex; gap: 4px; justify-content: flex-start; }
        
        .btn { padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        
        .btn-acao { 
            flex: 1;
            padding: 5px 2px; 
            font-size: 0.65rem; 
            border-radius: 4px; 
            cursor: pointer; 
            background: transparent; 
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid;
            min-width: 60px;
        }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--accent); width: 90%; max-width: 400px; }
        .modal-content label { display: block; color: #94a3b8; font-size: 0.7rem; margin: 10px 0 3px 0; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="color: var(--accent); margin: 0; font-size: 1.1rem;">Fluxo de Caixa - Matão Usinagem</h2>
        <a href="index.html" style="color: var(--accent); text-decoration: none; font-weight: bold; font-size: 0.8rem;">← VOLTAR</a>
    </div>
    
    <div class="dashboard-resumo">
        <div class="card"><h4>Receber</h4><div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div></div>
        <div class="card"><h4>A Pagar</h4><div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div></div>
        <div class="card"><h4>SICOOB</h4><div id="resumoSicoob" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><h4>CAIXA</h4><div id="resumoCaixa" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><h4>Aplicação</h4><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
    </div>

    <div class="filter-bar">
        <div class="filter-group"><label>INÍCIO</label><input type="date" id="fDataInicio"></div>
        <div class="filter-group"><label>FIM</label><input type="date" id="fDataFim"></div>
        <div class="filter-group">
            <label>STATUS</label>
            <select id="fStatus">
                <option value="">TODOS</option>
                <option value="ABERTO">ABERTO</option>
                <option value="PAGO">PAGO</option>
                <option value="RECEBIDO">RECEBIDO</option>
            </select>
        </div>
        <button onclick="carregarTudo()" class="btn" style="background: var(--accent); color: #020617;">FILTRAR</button>
    </div>

    <div style="margin-bottom: 15px; display: flex; gap: 8px;">
        <button onclick="abrirModal('DEBITO')" class="btn" style="background: #ef4444; color: white;">- Débito</button>
        <button onclick="abrirModal('CREDITO')" class="btn" style="background: #22c55e; color: white;">+ Crédito</button>
        <button onclick="abrirModalTransf()" class="btn" style="background: #a855f7; color: white;">Transf.</button>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>BANCO</th>
                    <th>DESCRIÇÃO</th>
                    <th>ENTRADA</th>
                    <th>SAÍDA</th>
                    <th>STATUS</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="listaFinanceiro"></tbody>
        </table>
    </div>
</div>

<div id="modalLancamento" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="color: var(--accent); margin: 0;">Lançamento</h3>
        <input type="hidden" id="editId">
        <input type="hidden" id="tipoOperacao">
        <label>NF / REF</label><input type="text" id="mNF">
        <label>DESCRIÇÃO</label><input type="text" id="mDesc">
        <label>VALOR (R$)</label><input type="number" step="0.01" id="mValor">
        <label>DATA</label><input type="date" id="mData">
        <label>BANCO</label><select id="mBanco"></select>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="salvarOperacao()" class="btn" style="background: #22c55e; color: white; flex: 1;">SALVAR</button>
            <button onclick="fecharModal()" class="btn" style="background: #475569; color: white; flex: 1;">FECHAR</button>
        </div>
    </div>
</div>

<div id="modalTransferencia" class="modal">
    <div class="modal-content" style="border-color: #a855f7;">
        <h3 style="color: #a855f7; margin: 0;">Transferência</h3>
        <label>SAÍDA</label><select id="tOrigem"></select>
        <label>ENTRADA</label><select id="tDestino"></select>
        <label>VALOR</label><input type="number" step="0.01" id="tValor">
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="executarTransferencia()" class="btn" style="background: #a855f7; color: white; flex: 1;">TRANSFERIR</button>
            <button onclick="fecharModalTransf()" class="btn" style="background: #475569; color: white; flex: 1;">FECHAR</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>
</body>
</html>
