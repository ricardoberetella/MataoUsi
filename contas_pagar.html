<div class="dashboard-resumo">
    <div class="card"><h4>Previsão Receber</h4><div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div></div>
    <div class="card"><h4>Contas a Pagar</h4><div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div></div>
    <div class="card"><h4>SICOOB</h4><div id="resumoSicoob" class="valor" style="color: #38bdf8;">R$ 0,00</div></div>
    <div class="card"><h4>CAIXA</h4><div id="resumoCaixa" class="valor" style="color: #38bdf8;">R$ 0,00</div></div>
    <div class="card"><h4>Aplicação</h4><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
</div>

<div style="margin: 20px 0; display: flex; gap: 10px;">
    <button onclick="abrirModal('DEBITO')" class="btn" style="background: #ef4444; color: white; padding: 12px 20px;">- Débito (Saída)</button>
    <button onclick="abrirModal('CREDITO')" class="btn" style="background: #22c55e; color: white; padding: 12px 20px;">+ Crédito (Entrada)</button>
    <button class="btn" style="background: #a855f7; color: white; padding: 12px 20px;">Transferência</button>
</div>

<div id="modalLancamento" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#0f172a; padding:30px; border-radius:15px; border:1px solid #38bdf8; width:400px;">
        <h2 id="modalTitle" style="color:#38bdf8; margin-top:0;">Lançamento</h2>
        <input type="hidden" id="tipoOperacao">
        
        <label style="color:#94a3b8; font-size:12px;">NÚMERO DA NF</label>
        <input type="text" id="mNF" style="width:100%; padding:10px; margin:8px 0; background:#1e293b; border:1px solid #334155; color:white; border-radius:5px;">
        
        <label style="color:#94a3b8; font-size:12px;">DESCRIÇÃO</label>
        <input type="text" id="mDesc" style="width:100%; padding:10px; margin:8px 0; background:#1e293b; border:1px solid #334155; color:white; border-radius:5px;">
        
        <label style="color:#94a3b8; font-size:12px;">VALOR (R$)</label>
        <input type="number" step="0.01" id="mValor" style="width:100%; padding:10px; margin:8px 0; background:#1e293b; border:1px solid #334155; color:white; border-radius:5px;">
        
        <label style="color:#94a3b8; font-size:12px;">DATA DE VENCIMENTO</label>
        <input type="date" id="mData" style="width:100%; padding:10px; margin:8px 0; background:#1e293b; border:1px solid #334155; color:white; border-radius:5px;">
        
        <label style="color:#94a3b8; font-size:12px;">ESCOLHA O BANCO</label>
        <select id="mBanco" style="width:100%; padding:10px; margin:8px 0; background:#1e293b; border:1px solid #334155; color:white; border-radius:5px;">
            </select>

        <div style="display:flex; gap:10px; margin-top:20px;">
            <button onclick="salvarOperacao()" style="flex:1; background:#22c55e; color:white; padding:12px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">CONFIRMAR</button>
            <button onclick="fecharModal()" style="flex:1; background:#475569; color:white; padding:12px; border:none; border-radius:5px; cursor:pointer;">CANCELAR</button>
        </div>
    </div>
</div>
