<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato Financeiro - Matão Usinagem</title>
    <link rel="stylesheet" href="css/contas_pagar.css">
    <style>
        /* Estilo específico para o botão Voltar conforme Print 1 */
        .btn-voltar-layout {
            background: transparent;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: 0.3s;
        }
        .btn-voltar-layout:hover { background: rgba(56, 189, 248, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="color: #38bdf8; margin: 0;">Extrato Financeiro</h2>
        <a href="dashboard.html" class="btn-voltar-layout">← Voltar ao Menu</a>
    </div>

    <div class="filter-bar">
        <div class="filter-group"><label>DATA INÍCIO</label><input type="date" id="fDataInicio"></div>
        <div class="filter-group"><label>DATA FIM</label><input type="date" id="fDataFim"></div>
        <div class="filter-group">
            <label>STATUS</label>
            <select id="fStatus">
                <option value="">TODOS</option>
                <option value="ABERTO">ABERTO</option>
                <option value="PAGO">PAGO</option>
            </select>
        </div>
        <button onclick="carregarTudo()" class="btn-filtrar">FILTRAR</button>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button onclick="abrirModal('DEBITO')" style="background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">- Débito (Saída)</button>
        <button onclick="abrirModal('CREDITO')" style="background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">+ Crédito (Entrada)</button>
        <button onclick="abrirModal('TRANSFERENCIA')" style="background: #a855f7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">Transferência</button>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>BANCO</th>
                    <th>DESCRIÇÃO</th>
                    <th>ENTRADA</th>
                    <th>SAÍDA</th>
                    <th>STATUS</th>
                    <th>AÇÕES</th> </tr>
            </thead>
            <tbody id="listaFinanceiro"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>
</body>
</html>
