<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contas a Pagar - Matão Usinagem</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/dashboard.css">

<style>

.page-wrap{
max-width:1200px;
margin:20px auto;
padding:0 15px 25px;
}

.container{
width:100%;
padding:25px;
border-radius:18px;
background:rgba(2,6,23,.95);
border:1px solid rgba(56,189,248,.35);
box-shadow:0 0 20px rgba(56,189,248,.15);
}

.topo-contas-pagar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
}

.titulo-contas-pagar{
color:#38bdf8;
font-size:30px;
margin:0;
flex:1;
text-align:center;
}

.btn-voltar-topo{
background:transparent;
color:#38bdf8;
border:2px solid #38bdf8;
border-radius:14px;
padding:12px 22px;
font-weight:700;
font-size:16px;
cursor:pointer;
transition:.2s;
}

.btn-voltar-topo:hover{
background:rgba(56,189,248,.08);
}

.cards-bancos{
display:flex;
gap:15px;
margin-bottom:20px;
flex-wrap:wrap;
}

.bloco-filtros{
background:rgba(30,41,59,.65);
padding:18px;
border-radius:12px;
}

.filtros-linha{
display:flex;
flex-direction:column;
gap:16px;
}

.campos-linha{
display:grid;
grid-template-columns:160px 180px 180px 160px 160px;
gap:16px;
align-items:end;
}

.botoes-linha{
display:flex;
justify-content:flex-end;
align-items:center;
gap:12px;
flex-wrap:wrap;
padding-top:4px;
}

.campo-filtro{
display:flex;
flex-direction:column;
gap:6px;
}

.campo-filtro input,
.campo-filtro select{
padding:12px 14px;
border-radius:10px;
background:#1e293b;
color:white;
border:1px solid #334155;
height:48px;
font-size:16px;
}

.btn-acao{
cursor:pointer;
border:none;
padding:0 20px;
border-radius:10px;
font-weight:bold;
color:white;
height:48px;
font-size:16px;
}

.label-futuro{
color:#38bdf8;
font-size:.78rem;
letter-spacing:1px;
text-transform:uppercase;
}

.tabela-wrapper{
margin-top:25px;
overflow-x:auto;
}

.tabela-pagar{
width:100%;
border-collapse:collapse;
min-width:1100px;
}

.tabela-pagar thead tr{
border-bottom:2px solid #38bdf8;
color:#38bdf8;
}

.tabela-pagar th,
.tabela-pagar td{
padding:12px;
}

.tabela-pagar tbody tr{
border-bottom:1px solid rgba(148,163,184,.18);
}

.valor-entrada{
color:#22c55e;
font-weight:bold;
}

.valor-saida{
color:#ef4444;
font-weight:bold;
}

.modal-financeiro{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
align-items:center;
justify-content:center;
z-index:1000;
padding:20px;
}

.modal-content{
background:#0f172a;
border:2px solid #38bdf8;
padding:25px;
border-radius:15px;
width:100%;
max-width:460px;
color:white;
}

.modal-content input,
.modal-content select,
.modal-content textarea{
width:100%;
padding:12px;
margin:10px 0;
background:#1e293b;
border:1px solid #334155;
color:white;
border-radius:8px;
}

.acoes-modal{
display:flex;
gap:10px;
margin-top:20px;
}

.grid-2{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

@media (max-width: 1100px){
.campos-linha{
grid-template-columns:repeat(2, minmax(180px, 1fr));
}
}

@media (max-width: 700px){
.campos-linha{
grid-template-columns:1fr;
}

.botoes-linha{
justify-content:stretch;
}

.btn-acao{
width:100%;
}
}

</style>
</head>

<body>

<div class="page-wrap">
<div class="container">

<header class="topo-contas-pagar">

<a href="dashboard.html">
<button class="btn-voltar-topo">← Voltar ao Menu</button>
</a>

<h1 class="titulo-contas-pagar">FINANCEIRO</h1>

<div style="width:170px;"></div>

</header>

<div id="cardsBancos" class="cards-bancos"></div>

<div class="bloco-filtros">

<div class="filtros-linha">

<div class="campos-linha">

<div class="campo-filtro">
<label class="label-futuro">Banco</label>
<select id="filtroBanco">
<option value="">Todos</option>
</select>
</div>

<div class="campo-filtro">
<label class="label-futuro">Data exata</label>
<input type="date" id="filtroData">
</div>

<div class="campo-filtro">
<label class="label-futuro">Mês</label>
<input type="month" id="filtroMes">
</div>

<div class="campo-filtro">
<label class="label-futuro">Status</label>
<select id="filtroStatus">
<option value="ABERTO">Não pagos</option>
<option value="PAGO">Pagos</option>
<option value="TODOS">Todos</option>
</select>
</div>

<div class="campo-filtro">
<label class="label-futuro">Tipo</label>
<select id="filtroTipo">
<option value="TODOS">Todos</option>
<option value="SAIDA">Despesas</option>
<option value="ENTRADA">NF Entrada</option>
</select>
</div>

</div>

<div class="botoes-linha">

<button id="btnTransferir" class="btn-acao" style="background:#8b5cf6;">
Transferências
</button>

<button id="btnFiltrar" class="btn-acao" style="background:#38bdf8;">
Filtrar
</button>

<button id="btnLimparFiltros" class="btn-acao" style="background:#475569;">
Limpar
</button>

<button id="btnNovoPagar" class="btn-acao" style="background:#10b981;">
+ Novo Lançamento
</button>

<button id="btnNfEntrada" class="btn-acao" style="background:#06b6d4;">
NF Entrada
</button>

</div>

</div>

</div>

<div class="tabela-wrapper">

<table class="tabela-pagar">

<thead>
<tr>
<th>Data</th>
<th>Banco</th>
<th>Descrição</th>
<th>Entrada</th>
<th>Saída</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="listaPagar"></tbody>

</table>

</div>

</div>
</div>

<script type="module" src="js/contas_pagar.js"></script>

<script>
function validarMoeda(input){
input.value=input.value.replace(/[^0-9,]/g,'');
}
</script>

</body>
</html>
