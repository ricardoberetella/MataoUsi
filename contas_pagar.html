<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro - Matão Usinagem</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: #020617; color: white; font-family: sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: auto; }
        .btn-voltar { display: inline-flex; align-items: center; padding: 8px 16px; border: 1px solid #38bdf8; color: #38bdf8; text-decoration: none; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        
        /* Dashboard de Saldo (Print 1 integrado) */
        .dashboard-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: #0f172a; border: 1px solid #1e293b; padding: 15px; border-radius: 12px; text-align: center; }
        .card h4 { margin: 0 0 10px 0; font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
        .card .valor { font-size: 1.2rem; font-weight: bold; }
        .v-positivo { color: #38bdf8; }
        .v-negativo { color: #ef4444; }
        .v-neutro { color: #a855f7; }

        .filter-bar { background: #0f172a; padding: 12px; border-radius: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; border: 1px solid #1e293b; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 0.7rem; color: #38bdf8; text-transform: uppercase; font-weight: bold; }
        .filter-bar input, .filter-bar select { background: #1e293b; border: 1px solid #334155; color: white; padding: 6px; border-radius: 6px; font-size: 0.85rem; }

        .flex-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; font-size: 0.85rem; }
        .btn-verde { background: #22c55e; }
        .btn-roxo { background: #a855f7; }
        .btn-azul { background: #38bdf8; color: #020617; }
        .btn-cinza { background: #475569; }
        .btn-vermelho { background: #ef4444; }

        .tabela-container { background: #0f172a; border-radius: 8px; border: 1px solid #1e293b; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #1e293b; color: #38bdf8; padding: 12px; text-align: left; font-size: 0.75rem; border-bottom: 2px solid #38bdf8; }
        td { padding: 12px; border-bottom: 1px solid #334155; font-size: 0.85rem; }
        
        .acoes-flex { display: flex; gap: 6px; }
        .status-aberto { color: #fbbf24; font-weight: bold; }
        .status-pago { color: #22c55e; font-weight: bold; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #0f172a; padding: 25px; border-radius: 12px; border: 1px solid #38bdf8; width: 90%; max-width: 380px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-voltar">← Voltar ao Menu</a>
    
    <div class="dashboard-resumo">
        <div class="card"><h4>Disponível SICOOB</h4><div class="valor v-positivo" id="resumoSicoob">R$ 0,00</div></div>
        <div class="card"><h4>Disponível CAIXA</h4><div class="valor v-positivo" id="resumoCaixa">R$ 0,00</div></div>
        <div class="card"><h4>Contas a Pagar</h4><div class="valor v-negativo" id="resumoPagar">R$ 0,00</div></div>
        <div class="card"><h4>Saldo Projetado</h4><div class="valor v-neutro" id="resumoTotal">R$ 0,00</div></div>
    </div>

    <div class="filter-bar">
        <div class="filter-group"><label>Início</label><input type="date" id="filtroDataInicio"></div>
        <div class="filter-group"><label>Fim</label><input type="date" id="filtroDataFim"></div>
        <div class="filter-group">
            <label>Status</label>
            <select id="filtroStatus">
                <option value="ABERTO" selected>ABERTO</option>
                <option value="RECEBIDO">RECEBIDO</option>
                <option value="PAGO">PAGO</option>
                <option value="">TODOS</option>
            </select>
        </div>
        <button id="btnFiltrar" class="btn btn-azul">Filtrar</button>
    </div>

    <div class="flex-buttons">
        <button id="btnAbrirNovo" class="btn btn-verde">Novo Lançamento</button>
        <button id="btnAbrirTransf" class="btn btn-roxo">Transferência</button>
        <button id="btnAbrirNF" class="btn btn-azul">NF Entrada</button>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Banco</th>
                    <th>Descrição</th>
                    <th style="text-align: right;">Entrada</th>
                    <th style="text-align: right;">Saída</th>
                    <th style="text-align: center;">Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaPagar"></tbody>
        </table>
    </div>
</div>

<div id="modalNovo" class="modal">...</div>
<div id="modalTransferencia" class="modal">...</div>
<div id="modalNF" class="modal">...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>
</body>
</html>
