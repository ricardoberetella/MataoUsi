<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro - Matão Usinagem</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --border: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 10px; text-align: center; }
        .card h4 { margin: 0 0 8px 0; font-size: 0.7rem; color: #94a3b8; }
        .valor { font-size: 1.1rem; font-weight: bold; }
        
        /* Filtros */
        .filter-bar { background: var(--card); padding: 20px; border-radius: 10px; border: 1px solid var(--border); display: flex; gap: 15px; align-items: end; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-group label { display: block; font-size: 0.7rem; color: var(--accent); margin-bottom: 5px; font-weight: bold; }
        .filter-bar input, .filter-bar select { background: #1e293b; border: 1px solid #334155; color: white; padding: 8px; border-radius: 6px; }

        /* Tabela */
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
        th { background: #1e293b; color: var(--accent); padding: 12px; text-align: left; border-bottom: 2px solid var(--accent); font-size: 0.8rem; }
        td { padding: 12px; border-bottom: 1px solid #334155; font-size: 0.85rem; }
        
        .btn { padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-pagar { background: #22c55e; color: white; }
        .btn-excluir { background: #ef4444; color: white; margin-left: 5px; }
        .btn-estornar { background: #475569; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="color: var(--accent);">Controle Financeiro</h1>
        <a href="index.html" style="color: var(--accent); text-decoration: none;">← Voltar ao Menu</a>
    </div>

    <div class="dashboard">
        <div class="card"><h4>PREVISÃO RECEBER</h4><div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div></div>
        <div class="card"><h4>CONTAS A PAGAR</h4><div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div></div>
        <div class="card"><h4>SICOOB</h4><div id="resumoSicoob" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><h4>CAIXA</h4><div id="resumoCaixa" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><h4>APLICAÇÃO</h4><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
    </div>

    <div class="filter-bar">
        <div class="filter-group"><label>DATA INÍCIO</label><input type="date" id="fDataInicio"></div>
        <div class="filter-group"><label>DATA FIM</label><input type="date" id="fDataFim"></div>
        <div class="filter-group">
            <label>STATUS</label>
            <select id="fStatus">
                <option value="ABERTO">ABERTO</option>
                <option value="PAGO">PAGO</option>
                <option value="RECEBIDO">RECEBIDO</option>
                <option value="">TODOS</option>
            </select>
        </div>
        <button onclick="carregarTudo()" class="btn" style="background: var(--accent); color: #020617;">Filtrar</button>
    </div>

    <div style="margin-bottom: 20px; display: flex; gap: 10px;">
        <button class="btn" style="background: #22c55e; color: white;">Novo Lançamento</button>
        <button class="btn" style="background: #a855f7; color: white;">Transferência</button>
        <button class="btn" style="background: var(--accent); color: #020617;">NF Entrada</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>DATA</th>
                <th>BANCO</th>
                <th>DESCRIÇÃO</th>
                <th>ENTRADA</th>
                <th>SAÍDA</th>
                <th>STATUS</th>
                <th>AÇÕES</th>
            </tr>
        </thead>
        <tbody id="listaFinanceiro"></tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>
</body>
</html>
