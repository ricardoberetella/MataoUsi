<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato Financeiro - Matão Usinagem</title>
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        body { background-color: #0b1120; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Dashboard de Cards */
        .dashboard { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 30px; 
        }
        .card { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card small { color: #94a3b8; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .valor { font-size: 1.5rem; font-weight: 800; margin-top: 10px; }

        /* Botões de Ação Principais */
        .area-botoes { display: flex; gap: 15px; margin-bottom: 25px; }
        .btn-acao { 
            flex: 1; padding: 18px; border: none; border-radius: 10px; 
            color: white; font-weight: bold; font-size: 18px; cursor: pointer; 
            transition: transform 0.1s; 
        }
        .btn-acao:active { transform: scale(0.98); }

        /* Tabela de Lançamentos */
        .tabela-container { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #0f172a; padding: 15px; text-align: left; color: #38bdf8; font-size: 13px; }
        td { padding: 15px; border-bottom: 1px solid #334155; font-size: 14px; }

        /* MODAL COMPACTO (Metade do tamanho) */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); }
        .modal-content { 
            background: #1e293b; 
            margin: 5% auto; 
            padding: 20px; 
            width: 90%; 
            max-width: 320px; /* Reduzido conforme pedido */
            border-radius: 15px; 
            border: 1px solid #38bdf8; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }
        .modal-content h2 { color: #38bdf8; margin-top: 0; font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .modal-content label { display: block; margin-top: 12px; font-size: 12px; color: #94a3b8; }
        .modal-content input, .modal-content select { 
            width: 100%; padding: 10px; margin-top: 5px; 
            background: #0f172a; border: 1px solid #334155; 
            color: white; border-radius: 8px; box-sizing: border-box; 
        }
        .btn-salvar { width: 100%; padding: 15px; background: #38bdf8; border: none; color: #0f172a; font-weight: bold; border-radius: 8px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h1 style="color: #38bdf8; margin: 0;">Extrato Financeiro</h1>
            <a href="dashboard.html" style="color: #38bdf8; text-decoration: none; border: 1px solid #38bdf8; padding: 10px 20px; border-radius: 8px; font-weight: bold;">← VOLTAR</a>
        </div>

        <div class="dashboard">
            <div class="card"><small>Previsão Receber</small><div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div></div>
            <div class="card"><small>Contas a Pagar</small><div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div></div>
            <div class="card"><small>SICOOB</small><div id="resumoSicoob" class="valor" style="color: #38bdf8;">R$ 0,00</div></div>
            <div class="card"><small>Caixa Federal</small><div id="resumoCaixa" class="valor" style="color: #38bdf8;">R$ 0,00</div></div>
            <div class="card"><small>Aplicação</small><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
        </div>

        <div class="area-botoes">
            <button onclick="abrirModal('DEBITO')" class="btn-acao" style="background: #ef4444;">- Débito</button>
            <button onclick="abrirModal('CREDITO')" class="btn-acao" style="background: #22c55e;">+ Crédito</button>
            <button onclick="abrirModal('TRANSFERENCIA')" class="btn-acao" style="background: #a855f7;">Transferência</button>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>DATA</th><th>BANCO</th><th>DESCRIÇÃO</th><th>VALOR</th><th>STATUS</th><th style="text-align:center">AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="listaFinanceiro"></tbody>
            </table>
        </div>
    </div>

    <div id="modalFinanceiro" class="modal">
        <div class="modal-content">
            <h2 id="modalTitulo">Lançar Débito</h2>
            <input type="hidden" id="editId">
            
            <label>Data do Vencimento</label>
            <input type="date" id="campoData">
            
            <label>Selecionar Banco</label>
            <select id="campoBanco"></select>
            
            <label>Descrição do Lançamento</label>
            <input type="text" id="campoDescricao" placeholder="Ex: Matéria Prima">
            
            <label>Valor (R$)</label>
            <input type="number" step="0.01" id="campoValor" placeholder="0,00">
            
            <button onclick="salvarLancamento()" class="btn-salvar">SALVAR NO SISTEMA</button>
            <button onclick="fecharModal()" style="width:100%; background:none; border:none; color:#94a3b8; margin-top:10px; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/contas_pagar.js"></script>
</body>
</html>
