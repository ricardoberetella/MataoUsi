<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato Financeiro - Matão Usinagem</title>
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        /* Estilos de emergência caso o arquivo CSS falhe novamente */
        body { background-color: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 20px 0; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .valor { font-size: 1.2rem; font-weight: bold; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #334155; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #334155; }
        .status-pendente { color: #f59e0b; font-weight: bold; }
        .status-pago { color: #22c55e; font-weight: bold; }
        .btn-voltar { text-decoration: none; color: #38bdf8; border: 1px solid #38bdf8; padding: 5px 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 style="color: #38bdf8;">Extrato Financeiro</h1>
            <a href="dashboard.html" class="btn-voltar">← Voltar ao Menu</a>
        </div>

        <div class="dashboard">
            <div class="card"><small>PREVISÃO RECEBER</small><div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div></div>
            <div class="card"><small>CONTAS A PAGAR</small><div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div></div>
            <div class="card"><small>SICOOB</small><div id="resumoSicoob" class="valor">R$ 0,00</div></div>
            <div class="card"><small>CAIXA FEDERAL</small><div id="resumoCaixa" class="valor">R$ 0,00</div></div>
            <div class="card"><small>APLICAÇÃO</small><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>DATA</th><th>BANCO</th><th>DESCRIÇÃO</th><th>VALOR</th><th>STATUS</th><th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="listaFinanceiro">
                </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/contas_pagar.js"></script>
</body>
</html>
