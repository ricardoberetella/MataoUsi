<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato Financeiro - Matão Usinagem</title>
    <link rel="stylesheet" href="css/estilo.css"> <style>
        .status-pago { color: #22c55e; font-weight: bold; }
        .status-pendente { color: #f59e0b; font-weight: bold; }
        .btn-acao { background: #1e293b; border: 1px solid #38bdf8; color: white; padding: 5px 10px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: #0f172a; margin: 10% auto; padding: 20px; width: 350px; border-radius: 12px; border: 1px solid #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="acoes-topo">
            <h2>Extrato Financeiro</h2>
            <a href="dashboard.html" class="btn-voltar">← Voltar ao Menu</a>
        </div>

        <div class="dashboard">
            <div class="card">
                <small>PREVISÃO RECEBER</small>
                <div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div>
            </div>
            <div class="card">
                <small>CONTAS A PAGAR</small>
                <div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div>
            </div>
            <div class="card">
                <small>SICOOB</small>
                <div id="resumoSicoob" class="valor">R$ 0,00</div>
            </div>
            <div class="card">
                <small>CAIXA</small>
                <div id="resumoCaixa" class="valor">R$ 0,00</div>
            </div>
            <div class="card">
                <small>APLICAÇÃO</small>
                <div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div>
            </div>
        </div>

        <div class="botoes-acoes">
            <button class="btn-debito" onclick="abrirModal('DEBITO')">- Débito</button>
            <button class="btn-credito" onclick="abrirModal('CREDITO')">+ Crédito</button>
            <button class="btn-transf" onclick="abrirModal('TRANSFERENCIA')">Transferência</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>BANCO</th>
                    <th>DESCRIÇÃO</th>
                    <th>VALOR</th>
                    <th>STATUS</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="listaFinanceiro"></tbody>
        </table>
    </div>

    <div id="modalFinanceiro" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">Novo Lançamento</h3>
            <input type="hidden" id="editId">
            <label>Data</label>
            <input type="date" id="campoData">
            <label>Banco</label>
            <select id="campoBanco"></select>
            <label>Descrição</label>
            <input type="text" id="campoDescricao">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" id="campoValor">
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="salvarLancamento()" class="btn-credito">SALVAR</button>
                <button onclick="fecharModal()">CANCELAR</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/contas_pagar.js"></script>
</body>
</html>
