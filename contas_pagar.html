<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro - Matão Usinagem</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: #020617; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .btn-voltar { display: inline-flex; align-items: center; padding: 8px 16px; border: 1px solid #38bdf8; color: #38bdf8; text-decoration: none; border-radius: 8px; margin-bottom: 20px; }
        h1 { color: #38bdf8; text-align: center; }
        
        .filter-bar { background: #0f172a; padding: 15px; border-radius: 10px; display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; border: 1px solid #1e293b; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 0.75rem; color: #38bdf8; text-transform: uppercase; }
        .filter-bar input, .filter-bar select { background: #1e293b; border: 1px solid #334155; color: white; padding: 8px; border-radius: 6px; }

        .flex-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
        .btn-verde { background: #22c55e; }
        .btn-roxo { background: #a855f7; }
        .btn-azul { background: #38bdf8; color: #020617; }
        .btn-cinza { background: #475569; }
        .btn-vermelho { background: #ef4444; }

        .tabela-container { background: #0f172a; border-radius: 8px; overflow: hidden; border: 1px solid #1e293b; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1e293b; color: #38bdf8; padding: 15px; text-align: left; text-transform: uppercase; font-size: 0.8rem; border-bottom: 2px solid #38bdf8; }
        td { padding: 15px; border-bottom: 1px solid #334155; }
        
        .status-aberto { color: #fbbf24; font-weight: bold; }
        .status-recebido { color: #22c55e; font-weight: bold; }
        .valor-saida { color: #ef4444; font-weight: bold; }
        .valor-entrada { color: #22c55e; font-weight: bold; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #0f172a; padding: 25px; border-radius: 12px; border: 1px solid #38bdf8; width: 100%; max-width: 400px; }
        .modal input, .modal select { width: 100%; padding: 10px; margin: 10px 0; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        .modal label { font-size: 0.8rem; color: #38bdf8; display: block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-voltar">← Voltar ao Menu</a>
    <h1>Financeiro</h1>

    <div class="filter-bar">
        <div class="filter-group">
            <label>Data Início</label>
            <input type="date" id="filtroDataInicio">
        </div>
        <div class="filter-group">
            <label>Data Fim</label>
            <input type="date" id="filtroDataFim">
        </div>
        <div class="filter-group">
            <label>Status</label>
            <select id="filtroStatus">
                <option value="ABERTO" selected>ABERTO</option>
                <option value="RECEBIDO">RECEBIDO</option>
                <option value="PAGO">PAGO</option>
                <option value="">TODOS</option>
            </select>
        </div>
        <button onclick="carregarContas()" class="btn btn-azul">Filtrar</button>
    </div>

    <div class="flex-buttons">
        <button onclick="abrirModalNovo()" class="btn btn-verde">Novo Lançamento</button>
        <button onclick="abrirModalTransferencia()" class="btn btn-roxo">Transferência</button>
        <button onclick="abrirModalNF()" class="btn btn-azul">NF Entrada</button>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Banco</th>
                    <th>Descrição</th>
                    <th>Entrada</th>
                    <th>Saída</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaPagar"></tbody>
        </table>
    </div>
</div>

<div id="modalNovo" class="modal">
    <div class="modal-content">
        <h3 style="color: #22c55e;">Novo Lançamento</h3>
        <input type="text" id="novoDescricao" placeholder="Descrição">
        <input type="number" id="novoValor" placeholder="Valor (0.00)">
        <input type="date" id="novoVencimento">
        <select id="novoBanco"></select>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button onclick="fecharModais()" class="btn btn-cinza" style="flex: 1;">Cancelar</button>
            <button onclick="salvarNovo()" class="btn btn-verde" style="flex: 1;">Salvar</button>
        </div>
    </div>
</div>

<div id="modalTransferencia" class="modal">
    <div class="modal-content">
        <h3 style="color: #a855f7;">Transferência entre Contas</h3>
        <label>Origem:</label>
        <select id="transfOrigem"></select>
        <label>Destino:</label>
        <select id="transfDestino"></select>
        <input type="number" id="transfValor" placeholder="Valor R$">
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button onclick="fecharModais()" class="btn btn-cinza" style="flex: 1;">Cancelar</button>
            <button onclick="processarTransferencia()" class="btn btn-roxo" style="flex: 1;">Transferir</button>
        </div>
    </div>
</div>

<div id="modalNF" class="modal">
    <div class="modal-content">
        <h3 style="color: #38bdf8;">Lançar NF de Entrada</h3>
        <input type="text" id="nfDescricao" placeholder="NF ou Fornecedor">
        <input type="number" id="nfValor" placeholder="Valor Total">
        <input type="date" id="nfVencimento">
        <select id="nfBanco"></select>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button onclick="fecharModais()" class="btn btn-cinza" style="flex: 1;">Cancelar</button>
            <button onclick="salvarNF()" class="btn btn-azul" style="flex: 1;">Lançar NF</button>
        </div>
    </div>
</div>

</body>
</html>
