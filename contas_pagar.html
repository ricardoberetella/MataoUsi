<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato Financeiro - Matão Usinagem</title>
    <style>
        :root { 
            --bg: #020617; --card: #0f172a; --border: #1e293b; 
            --accent: #38bdf8; --text: #f8fafc; --danger: #ef4444;
            --success: #22c55e; --warning: #f59e0b;
        }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; text-align: center; }
        .card small { color: #94a3b8; font-weight: bold; font-size: 0.7rem; }
        .valor { font-size: 1.3rem; font-weight: bold; margin-top: 8px; }

        /* Botões */
        .acoes-topo { display: flex; gap: 10px; margin-bottom: 25px; align-items: center; }
        .btn { border: none; padding: 12px 20px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; text-decoration: none; }
        .btn-debito { background: var(--danger); }
        .btn-credito { background: var(--success); }
        .btn-transf { background: #a855f7; }
        .btn-voltar { background: transparent; border: 1px solid var(--accent); color: var(--accent); margin-left: auto; }

        /* Tabela */
        .tabela-container { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1e293b; color: var(--accent); padding: 15px; font-size: 0.8rem; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #1e293b; font-size: 0.9rem; }
        
        .status-pendente { color: var(--warning); font-weight: bold; }
        .status-pago { color: var(--success); font-weight: bold; }

        .btn-acao { background: #1e293b; border: 1px solid var(--border); color: white; padding: 6px 10px; border-radius: 6px; cursor: pointer; margin-right: 5px; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: var(--card); margin: 10% auto; padding: 30px; width: 350px; border-radius: 16px; border: 1px solid var(--accent); }
        input, select { width: 100%; background: #1e293b; border: 1px solid #334155; color: white; padding: 10px; margin: 10px 0; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="acoes-topo">
        <h2 style="margin: 0; color: var(--accent);">Extrato Financeiro</h2>
        <a href="dashboard.html" class="btn btn-voltar">← Voltar ao Menu</a>
    </div>

    <div class="dashboard">
        <div class="card"><small>PREVISÃO RECEBER</small><div id="resumoReceber" class="valor" style="color: var(--success);">R$ 0,00</div></div>
        <div class="card"><small>CONTAS A PAGAR</small><div id="resumoPagar" class="valor" style="color: var(--danger);">R$ 0,00</div></div>
        <div class="card"><small>SICOOB</small><div id="resumoSicoob" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><small>CAIXA FEDERAL</small><div id="resumoCaixa" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
    </div>

    <div class="acoes-topo">
        <button class="btn btn-debito" onclick="abrirModal('DEBITO')">- Débito</button>
        <button class="btn btn-credito" onclick="abrirModal('CREDITO')">+ Crédito</button>
        <button class="btn btn-transf" onclick="abrirModal('TRANSFERENCIA')">Transferência</button>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>BANCO</th>
                    <th>DESCRIÇÃO</th>
                    <th>VALOR</th>
                    <th>STATUS</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="listaFinanceiro"></tbody>
        </table>
    </div>
</div>

<div id="modalFinanceiro" class="modal">
    <div class="modal-content">
        <h3 id="modalTitulo" style="color: var(--accent); margin: 0 0 15px 0;">Novo Lançamento</h3>
        <input type="hidden" id="editId">
        
        <label style="font-size: 0.8rem;">Data</label>
        <input type="date" id="campoData">
        
        <label style="font-size: 0.8rem;">Banco</label>
        <select id="campoBanco"></select>
        
        <label style="font-size: 0.8rem;">Descrição</label>
        <input type="text" id="campoDescricao">
        
        <label style="font-size: 0.8rem;">Valor (R$)</label>
        <input type="number" step="0.01" id="campoValor">
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="salvarLancamento()" class="btn btn-credito" style="flex: 1;">SALVAR</button>
            <button onclick="fecharModal()" class="btn" style="flex: 1; background: #334155;">CANCELAR</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>

</body>
</html>
