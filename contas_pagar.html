<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Extrato Financeiro - Matão Usinagem</title>
    <style>
        /* Layout Base - Preservando o Estilo Escuro */
        body { background-color: #0b1120; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Dashboard de Cards */
        .dashboard { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 12px; 
            margin-bottom: 20px; 
        }
        .card { 
            background: #1e293b; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid #334155;
        }
        .card small { color: #94a3b8; font-weight: bold; font-size: 10px; text-transform: uppercase; }
        .valor { font-size: 1.3rem; font-weight: 800; margin-top: 8px; }

        /* Botões de Ação */
        .area-botoes { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-acao { 
            flex: 1; padding: 15px; border: none; border-radius: 8px; 
            color: white; font-weight: bold; font-size: 16px; cursor: pointer; 
        }

        /* Tabela */
        .tabela-container { background: #1e293b; border-radius: 12px; overflow-x: auto; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #0f172a; padding: 12px; text-align: left; color: #38bdf8; font-size: 12px; }
        td { padding: 12px; border-bottom: 1px solid #334155; font-size: 13px; }

        /* MODAIS CORRIGIDOS PARA TABLET */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 999; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
        }
        .modal-content { 
            background: #1e293b; 
            margin: 2% auto; /* Margem pequena para subir o modal */
            padding: 20px; 
            width: 90%; 
            max-width: 320px; /* Metade do tamanho anterior */
            max-height: 95vh; /* Não ultrapassa a altura da tela */
            overflow-y: auto; /* Rolagem interna se necessário */
            border-radius: 15px; 
            border: 1px solid #38bdf8; 
            box-sizing: border-box;
        }
        .modal-content h2 { color: #38bdf8; margin: 0 0 15px 0; font-size: 18px; text-align: center; }
        .modal-content label { display: block; margin-top: 10px; font-size: 12px; color: #94a3b8; }
        .modal-content input, .modal-content select { 
            width: 100%; padding: 10px; margin-top: 5px; 
            background: #0f172a; border: 1px solid #334155; 
            color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px;
        }
        .btn-salvar { 
            width: 100%; padding: 15px; background: #38bdf8; border: none; 
            color: #0f172a; font-weight: bold; border-radius: 8px; 
            margin-top: 20px; cursor: pointer; font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="color: #38bdf8; margin: 0; font-size: 24px;">Extrato Financeiro</h1>
            <a href="dashboard.html" style="color: #38bdf8; text-decoration: none; border: 1px solid #38bdf8; padding: 8px 15px; border-radius: 8px; font-size: 14px;">← MENU</a>
        </div>

        <div class="dashboard">
            <div class="card"><small>Receber</small><div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div></div>
            <div class="card"><small>A Pagar</small><div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div></div>
            <div class="card"><small>SICOOB</small><div id="resumoSicoob" class="valor" style="color: #38bdf8;">R$ 0,00</div></div>
            <div class="card"><small>CAIXA</small><div id="resumoCaixa" class="valor" style="color: #38bdf8;">R$ 0,00</div></div>
            <div class="card"><small>APLICAÇÃO</small><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
        </div>

        <div class="area-botoes">
            <button onclick="abrirModal('DEBITO')" class="btn-acao" style="background: #ef4444;">- Débito</button>
            <button onclick="abrirModal('CREDITO')" class="btn-acao" style="background: #22c55e;">+ Crédito</button>
            <button onclick="abrirModal('TRANSFERENCIA')" class="btn-acao" style="background: #a855f7;">Transferência</button>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>DATA</th><th>BANCO</th><th>DESCRIÇÃO</th><th>VALOR</th><th>STATUS</th><th style="text-align:center">AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="listaFinanceiro"></tbody>
            </table>
        </div>
    </div>

    <div id="modalFinanceiro" class="modal">
        <div class="modal-content">
            <h2 id="modalTitulo">Lançar</h2>
            <input type="hidden" id="editId">
            
            <label>Data</label>
            <input type="date" id="campoData">
            
            <label>Banco</label>
            <select id="campoBanco"></select>
            
            <label>Descrição</label>
            <input type="text" id="campoDescricao" placeholder="Ex: Matéria Prima">
            
            <label>Valor (R$)</label>
            <input type="number" step="0.01" id="campoValor" placeholder="0,00">
            
            <button onclick="salvarLancamento()" class="btn-salvar">SALVAR</button>
            <button onclick="fecharModais()" style="width:100%; background:none; border:none; color:#94a3b8; margin-top:10px; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <div id="modalTransferencia" class="modal">
        <div class="modal-content">
            <h2 style="color: #a855f7;">Transferência</h2>
            
            <label>Data</label>
            <input type="date" id="transfData">
            
            <label>Sair de (Origem)</label>
            <select id="transfOrigem"></select>
            
            <label>Entrar em (Destino)</label>
            <select id="transfDestino"></select>
            
            <label>Valor (R$)</label>
            <input type="number" step="0.01" id="transfValor" placeholder="0,00">
            
            <button onclick="executarTransferencia()" class="btn-salvar" style="background: #a855f7; color: white;">CONFIRMAR</button>
            <button onclick="fecharModais()" style="width:100%; background:none; border:none; color:#94a3b8; margin-top:10px; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/contas_pagar.js"></script>
</body>
</html>
