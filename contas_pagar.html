<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de Caixa / Extrato - Matão Usinagem</title>
    <link rel="stylesheet" href="css/contas_pagar.css">
    <style>
        .btn-voltar-topo {
            background: transparent;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .dashboard-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .card { background: #0f172a; border: 1px solid #1e293b; padding: 15px; border-radius: 10px; text-align: center; }
        .acoes-admin { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-acao { border: none; padding: 10px 20px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .btn-debito { background-color: #ef4444; }
        .btn-credito { background-color: #22c55e; }
        .btn-transf { background-color: #a855f7; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="color: #38bdf8;">Fluxo de Caixa / Extrato</h2>
        <a href="dashboard.html" class="btn-voltar-topo">← Voltar ao Menu</a>
    </div>

    <div class="dashboard-resumo">
        <div class="card"><small>PREVISÃO RECEBER</small><div id="resumoReceber" style="color:#22c55e; font-weight:bold;">R$ 0,00</div></div>
        <div class="card"><small>CONTAS A PAGAR</small><div id="resumoPagar" style="color:#ef4444; font-weight:bold;">R$ 0,00</div></div>
        <div class="card"><small>SICOOB</small><div id="resumoSicoob" style="color:#38bdf8; font-weight:bold;">R$ 0,00</div></div>
        <div class="card"><small>CAIXA</small><div id="resumoCaixa" style="color:#38bdf8; font-weight:bold;">R$ 0,00</div></div>
    </div>

    <div class="filter-bar">
        <input type="date" id="fDataInicio">
        <input type="date" id="fDataFim">
        <select id="fStatus">
            <option value="">TODOS</option>
            <option value="ABERTO">ABERTO</option>
            <option value="PAGO">PAGO</option>
        </select>
        <button onclick="carregarTudo()" class="btn-filtrar">FILTRAR</button>
    </div>

    <div class="acoes-admin">
        <button class="btn-acao btn-debito" onclick="abrirModal('DEBITO')">- Débito (Saída)</button>
        <button class="btn-acao btn-credito" onclick="abrirModal('CREDITO')">+ Crédito (Entrada)</button>
        <button class="btn-acao btn-transf" onclick="abrirModal('TRANSFERENCIA')">Transferência</button>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>BANCO</th>
                    <th>DESCRIÇÃO</th>
                    <th>ENTRADA</th>
                    <th>SAÍDA</th>
                    <th>STATUS</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="listaFinanceiro"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>
</body>
</html>
