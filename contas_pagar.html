<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de Caixa - Matão Usinagem</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --border: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .dashboard-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 10px; text-align: center; }
        .valor { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        .acoes-topo { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { border: none; padding: 10px 20px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .btn-debito { background: #ef4444; }
        .btn-credito { background: #22c55e; }
        .tabela-container { background: var(--card); border-radius: 10px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .status-pendente { color: #f59e0b; font-weight: bold; }
        .status-pago { color: #22c55e; font-weight: bold; }
        .btn-acao { padding: 4px 8px; font-size: 0.75rem; margin-right: 4px; border-radius: 4px; border: 1px solid var(--border); background: #1e293b; color: white; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: var(--card); margin: 5% auto; padding: 25px; width: 350px; border-radius: 12px; border: 1px solid var(--accent); }
        input, select { width: 100%; background: #1e293b; border: 1px solid #334155; color: white; padding: 8px; margin: 8px 0; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-resumo">
        <div class="card"><small>PREVISÃO RECEBER</small><div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div></div>
        <div class="card"><small>CONTAS A PAGAR</small><div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div></div>
        <div class="card"><small>SICOOB</small><div id="resumoSicoob" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><small>CAIXA</small><div id="resumoCaixa" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><small>APLICAÇÃO</small><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
    </div>

    <div class="acoes-topo">
        <button class="btn btn-debito" onclick="abrirModal('DEBITO')">- Débito</button>
        <button class="btn btn-credito" onclick="abrirModal('CREDITO')">+ Crédito</button>
        <a href="dashboard.html" class="btn" style="background: #334155; text-decoration: none; line-height: 20px;">Voltar</a>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>BANCO</th>
                    <th>DESCRIÇÃO</th>
                    <th>VALOR</th>
                    <th>STATUS</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="listaFinanceiro"></tbody>
        </table>
    </div>
</div>

<div id="modalFinanceiro" class="modal">
    <div class="modal-content">
        <h3 id="modalTitulo" style="color: var(--accent); margin-top: 0;">Novo Lançamento</h3>
        <input type="date" id="campoData">
        <select id="campoBanco"></select>
        <input type="text" id="campoDescricao" placeholder="Descrição">
        <input type="number" step="0.01" id="campoValor" placeholder="Valor R$">
        <button onclick="salvarLancamento()" class="btn btn-credito" style="width: 100%; margin-top: 10px;">SALVAR</button>
        <button onclick="fecharModal()" class="btn" style="width: 100%; margin-top: 5px; background: transparent;">Cancelar</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>
</body>
</html>
