<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Extrato Financeiro</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Segoe UI, Arial, sans-serif;
background:radial-gradient(circle at top,#0b1224,#020617 70%);
color:white;
}

.container{
width:100%;
max-width:1400px;
margin:auto;
padding:20px 24px 30px;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
flex-wrap:wrap;
}

h1{
color:#38bdf8;
margin:0;
font-size:28px;
}

.topo-direita{
display:flex;
gap:10px;
align-items:center;
}

.btn-voltar,
.btn-topo{
border:none;
border-radius:8px;
padding:8px 14px;
cursor:pointer;
font-weight:600;
}

.btn-voltar{
background:#020617;
border:1px solid #38bdf8;
color:#38bdf8;
}

.btn-topo{
background:#38bdf8;
color:#001018;
}

/* ===== CARDS COMPACTOS ===== */

.cards{
display:flex;
gap:10px;
margin-bottom:12px;
}

.card{
flex:1;
background:linear-gradient(180deg,#1e293b,#0f172a);
border:1px solid #334155;
padding:10px 6px;
border-radius:10px;
text-align:center;
height:65px;
display:flex;
flex-direction:column;
justify-content:center;
}

.card h3{
font-size:11px;
color:#94a3b8;
margin:0 0 3px 0;
}

.card span{
font-size:16px;
font-weight:bold;
}

.receber{color:#22c55e}
.pagar{color:#ef4444}
.aplicacao{color:#a855f7}

/* ===== FILTROS ===== */

.filtros{
display:flex;
gap:12px;
margin-bottom:15px;
align-items:end;
flex-wrap:wrap;
background:#0f172a;
border:1px solid #334155;
border-radius:10px;
padding:10px;
}

.campo-filtro{
display:flex;
flex-direction:column;
gap:4px;
}

label{
font-size:12px;
color:#cbd5e1;
}

select,input{
padding:8px;
border-radius:8px;
border:1px solid #334155;
background:#020617;
color:white;
}

.btn-filtro{
background:#1e293b;
color:white;
border:1px solid #334155;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
}

/* ===== TABELA ===== */

.tabela-wrap{
overflow:auto;
border-radius:12px;
border:1px solid #334155;
background:#0f172a;
}

.tabela{
width:100%;
border-collapse:collapse;
min-width:850px;
}

.tabela th{
text-align:left;
color:#38bdf8;
padding:12px;
border-bottom:2px solid #334155;
}

.tabela td{
padding:10px;
border-bottom:1px solid #334155;
}

.tabela tr:hover td{
background:#1e293b;
}

.btn-tabela{
padding:5px 8px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:12px;
margin:2px;
color:white;
}

.btn-pagar{background:#16a34a}
.btn-estornar{background:#d97706}
.btn-editar{background:#0284c7}
.btn-excluir{background:#dc2626}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
padding:20px;
}

.modal-content{
background:#0f172a;
border:1px solid #334155;
padding:20px;
border-radius:12px;
max-width:450px;
margin:60px auto;
}

</style>

</head>

<body>

<div class="container">

<div class="topo">

<h1>Extrato Financeiro</h1>

<div class="topo-direita">

<div id="containerAcoesTopo">
<button class="btn-topo" onclick="abrirModal('NOVO CREDITO')">+ Crédito</button>
<button class="btn-topo" onclick="abrirModal('NOVO DEBITO')">+ Débito</button>
<button class="btn-topo" onclick="abrirModalTransferencia()">⇄ Transferência</button>
</div>

<button class="btn-voltar" onclick="window.location.href='dashboard.html'">
← Voltar
</button>

</div>

</div>

<!-- CARDS -->

<div class="cards">

<div class="card">
<h3>RECEBER</h3>
<span id="resumoReceber" class="receber">R$ 0,00</span>
</div>

<div class="card">
<h3>A PAGAR</h3>
<span id="resumoPagar" class="pagar">R$ 0,00</span>
</div>

<div class="card">
<h3>SICOOB</h3>
<span id="resumoSicoob">R$ 0,00</span>
</div>

<div class="card">
<h3>CAIXA FEDERAL</h3>
<span id="resumoCaixa">R$ 0,00</span>
</div>

<div class="card">
<h3>APLICAÇÃO</h3>
<span id="resumoAplicacao" class="aplicacao">R$ 0,00</span>
</div>

</div>

<!-- FILTROS -->

<div class="filtros">

<div class="campo-filtro">
<label>Mês</label>
<select id="filtroMes">
<option value="1">Janeiro</option>
<option value="2">Fevereiro</option>
<option value="3">Março</option>
<option value="4">Abril</option>
<option value="5">Maio</option>
<option value="6">Junho</option>
<option value="7">Julho</option>
<option value="8">Agosto</option>
<option value="9">Setembro</option>
<option value="10">Outubro</option>
<option value="11">Novembro</option>
<option value="12">Dezembro</option>
</select>
</div>

<div class="campo-filtro">
<label>Ano</label>
<select id="filtroAno"></select>
</div>

<button class="btn-filtro" onclick="limparFiltroMesAno()">Mês Atual</button>

</div>

<div class="tabela-wrap">

<table class="tabela">

<thead>
<tr>
<th>DATA</th>
<th>BANCO</th>
<th>DESCRIÇÃO</th>
<th>VALOR</th>
<th>STATUS</th>
<th id="thAcoes">AÇÕES</th>
</tr>
</thead>

<tbody id="listaFinanceiro">
<tr>
<td colspan="6" style="text-align:center;color:#94a3b8">
Carregando dados...
</td>
</tr>
</tbody>

</table>

</div>

</div>

<script type="module" src="js/contas_pagar.js"></script>

</body>
</html>
