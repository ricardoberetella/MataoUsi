<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrato Financeiro</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Segoe UI, Arial, sans-serif;
      background:radial-gradient(circle at top,#0b1224,#020617 70%);
      color:#fff;
    }

    .container{
      max-width:1280px;
      margin:auto;
      padding:30px;
    }

    .topo{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:24px;
      flex-wrap:wrap;
    }

    h1{
      color:#38bdf8;
      margin:0;
      font-size:32px;
    }

    .topo-direita{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .btn-voltar,
    .btn-topo,
    .btn-modal,
    .btn-cancelar,
    .btn-filtro{
      border:none;
      border-radius:10px;
      padding:10px 16px;
      cursor:pointer;
      font-weight:600;
      transition:0.2s;
    }

    .btn-voltar{
      background:#020617;
      border:1px solid #38bdf8;
      color:#38bdf8;
    }

    .btn-topo{
      background:#38bdf8;
      color:#001018;
    }

    .btn-topo:hover,
    .btn-voltar:hover,
    .btn-modal:hover,
    .btn-cancelar:hover,
    .btn-filtro:hover{
      transform:translateY(-1px);
      filter:brightness(1.05);
    }

    #containerAcoesTopo{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:18px;
      margin-bottom:28px;
    }

    .card{
      background:linear-gradient(180deg,#1e293b,#0f172a);
      border:1px solid #334155;
      padding:20px;
      border-radius:14px;
      text-align:center;
      box-shadow:0 0 0 1px rgba(56,189,248,0.05), 0 8px 24px rgba(0,0,0,0.25);
    }

    .card h3{
      font-size:13px;
      color:#94a3b8;
      margin:0 0 10px 0;
      letter-spacing:0.5px;
    }

    .card span{
      font-size:22px;
      font-weight:700;
    }

    .receber{color:#22c55e;}
    .pagar{color:#ef4444;}
    .aplicacao{color:#a855f7;}

    .filtros{
      display:flex;
      gap:14px;
      margin-bottom:20px;
      align-items:end;
      flex-wrap:wrap;
      background:rgba(15,23,42,0.7);
      border:1px solid #334155;
      border-radius:14px;
      padding:16px;
    }

    .campo-filtro{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:170px;
    }

    label{
      font-size:13px;
      color:#cbd5e1;
      font-weight:600;
    }

    select,
    input{
      width:100%;
      padding:11px 12px;
      border-radius:10px;
      border:1px solid #334155;
      background:#020617;
      color:#fff;
      outline:none;
    }

    select:focus,
    input:focus{
      border-color:#38bdf8;
      box-shadow:0 0 0 2px rgba(56,189,248,0.15);
    }

    .btn-filtro{
      background:#1e293b;
      color:#fff;
      border:1px solid #334155;
      height:43px;
    }

    .tabela-wrap{
      overflow:auto;
      border-radius:14px;
      border:1px solid #334155;
      background:rgba(15,23,42,0.72);
    }

    .tabela{
      width:100%;
      border-collapse:collapse;
      min-width:880px;
    }

    .tabela th{
      text-align:left;
      color:#38bdf8;
      padding:14px 12px;
      border-bottom:2px solid #334155;
      background:#0f172a;
      font-size:14px;
      white-space:nowrap;
    }

    .tabela td{
      padding:12px;
      border-bottom:1px solid #334155;
      vertical-align:middle;
    }

    .tabela tr:hover td{
      background:rgba(30,41,59,0.55);
    }

    .btn-tabela{
      padding:7px 10px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
      margin:2px;
      color:#fff;
    }

    .btn-pagar{background:#16a34a;}
    .btn-estornar{background:#d97706;}
    .btn-editar{background:#0284c7;}
    .btn-excluir{background:#dc2626;}

    .hidden{
      display:none !important;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.68);
      z-index:999;
      padding:20px;
      overflow:auto;
    }

    .modal-content{
      background:#0f172a;
      border:1px solid #334155;
      padding:24px;
      border-radius:16px;
      max-width:520px;
      margin:60px auto;
      box-shadow:0 20px 50px rgba(0,0,0,0.35);
    }

    .modal-content h2{
      margin:0 0 18px 0;
      color:#38bdf8;
    }

    .acoes-modal{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      flex-wrap:wrap;
      margin-top:8px;
    }

    .btn-modal{
      background:#38bdf8;
      color:#001018;
    }

    .btn-cancelar{
      background:#334155;
      color:#fff;
    }

    .vazio{
      text-align:center;
      padding:24px;
      color:#94a3b8;
    }

    @media (max-width: 1100px){
      .cards{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media (max-width: 700px){
      .container{
        padding:18px;
      }

      .cards{
        grid-template-columns:1fr;
      }

      h1{
        font-size:26px;
      }

      .topo{
        align-items:flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="topo">
      <h1>Extrato Financeiro</h1>

      <div class="topo-direita">
        <div id="containerAcoesTopo">
          <button class="btn-topo" onclick="abrirModal('NOVO CREDITO')">+ Crédito</button>
          <button class="btn-topo" onclick="abrirModal('NOVO DEBITO')">+ Débito</button>
          <button class="btn-topo" onclick="abrirModalTransferencia()">⇄ Transferência</button>
        </div>

        <button class="btn-voltar" onclick="window.location.href='dashboard.html'">
          ← Voltar
        </button>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <h3>RECEBER</h3>
        <span id="resumoReceber" class="receber">R$ 0,00</span>
      </div>

      <div class="card">
        <h3>A PAGAR</h3>
        <span id="resumoPagar" class="pagar">R$ 0,00</span>
      </div>

      <div class="card">
        <h3>SICOOB</h3>
        <span id="resumoSicoob">R$ 0,00</span>
      </div>

      <div class="card">
        <h3>CAIXA FEDERAL</h3>
        <span id="resumoCaixa">R$ 0,00</span>
      </div>

      <div class="card">
        <h3>APLICAÇÃO</h3>
        <span id="resumoAplicacao" class="aplicacao">R$ 0,00</span>
      </div>
    </div>

    <div class="filtros">
      <div class="campo-filtro">
        <label for="filtroMes">Mês</label>
        <select id="filtroMes" onchange="carregarTudo && carregarTudo()">
          <option value="1">Janeiro</option>
          <option value="2">Fevereiro</option>
          <option value="3">Março</option>
          <option value="4">Abril</option>
          <option value="5">Maio</option>
          <option value="6">Junho</option>
          <option value="7">Julho</option>
          <option value="8">Agosto</option>
          <option value="9">Setembro</option>
          <option value="10">Outubro</option>
          <option value="11">Novembro</option>
          <option value="12">Dezembro</option>
        </select>
      </div>

      <div class="campo-filtro">
        <label for="filtroAno">Ano</label>
        <select id="filtroAno" onchange="carregarTudo && carregarTudo()"></select>
      </div>

      <button class="btn-filtro" onclick="limparFiltroMesAno()">Mês Atual</button>
    </div>

    <div class="tabela-wrap">
      <table class="tabela">
        <thead>
          <tr>
            <th>DATA</th>
            <th>BANCO</th>
            <th>DESCRIÇÃO</th>
            <th>VALOR</th>
            <th>STATUS</th>
            <th id="thAcoes">AÇÕES</th>
          </tr>
        </thead>
        <tbody id="listaFinanceiro">
          <tr>
            <td colspan="6" class="vazio">Carregando dados...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- MODAL LANÇAMENTO -->
  <div id="modalFinanceiro" class="modal">
    <div class="modal-content">
      <h2 id="modalTitulo">NOVO</h2>

      <input type="hidden" id="editId">

      <label for="campoData">Data</label>
      <input type="date" id="campoData">

      <label for="campoBanco">Banco</label>
      <select id="campoBanco"></select>

      <label for="campoDescricao">Descrição</label>
      <input id="campoDescricao" type="text">

      <label for="campoValor">Valor</label>
      <input id="campoValor" type="number" step="0.01">

      <div class="acoes-modal">
        <button class="btn-cancelar" onclick="fecharModais()">Cancelar</button>
        <button class="btn-modal" onclick="salvarLancamento()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL TRANSFERÊNCIA -->
  <div id="modalTransferencia" class="modal">
    <div class="modal-content">
      <h2>Nova Transferência</h2>

      <label for="transferData">Data</label>
      <input type="date" id="transferData">

      <label for="transferOrigem">Conta Origem</label>
      <select id="transferOrigem"></select>

      <label for="transferDestino">Conta Destino</label>
      <select id="transferDestino"></select>

      <label for="transferValor">Valor</label>
      <input type="number" id="transferValor" step="0.01">

      <label for="transferDescricao">Descrição</label>
      <input type="text" id="transferDescricao" placeholder="Opcional">

      <div class="acoes-modal">
        <button class="btn-cancelar" onclick="fecharModalTransferencia()">Cancelar</button>
        <button class="btn-modal" onclick="salvarTransferencia()">Salvar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/contas_pagar.js"></script>
</body>
</html>
