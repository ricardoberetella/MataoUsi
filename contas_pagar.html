<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro - Matão Usinagem</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --border: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: auto; }
        
        /* Dashboard */
        .dashboard-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; text-align: center; }
        .card h4 { margin: 0 0 10px 0; font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }
        .valor { font-size: 1.2rem; font-weight: bold; }
        
        /* Filtros */
        .filter-bar { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; gap: 15px; margin-bottom: 25px; align-items: end; flex-wrap: wrap; }
        .filter-group { flex: 1; min-width: 150px; }
        .filter-group label { display: block; font-size: 0.7rem; color: var(--accent); margin-bottom: 5px; font-weight: bold; }
        .filter-bar input, .filter-bar select { background: #1e293b; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; width: 100%; }

        /* Tabela */
        .tabela-container { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #1e293b; color: var(--accent); padding: 15px; text-align: left; font-size: 0.8rem; border-bottom: 2px solid var(--accent); }
        td { padding: 12px 15px; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        
        /* Botões e Modais */
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid var(--accent); width: 420px; }
        .modal-content label { display: block; color: #94a3b8; font-size: 0.75rem; margin-bottom: 5px; margin-top: 10px; }
        .modal-content input, .modal-content select { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="color: var(--accent);">Fluxo de Caixa / Extrato</h1>
        <a href="index.html" style="color: var(--accent); text-decoration: none; font-weight: bold;">← VOLTAR AO MENU</a>
    </div>
    
    <div class="dashboard-resumo">
        <div class="card"><h4>Previsão Receber</h4><div id="resumoReceber" class="valor" style="color: #22c55e;">R$ 0,00</div></div>
        <div class="card"><h4>Contas a Pagar</h4><div id="resumoPagar" class="valor" style="color: #ef4444;">R$ 0,00</div></div>
        <div class="card"><h4>SICOOB</h4><div id="resumoSicoob" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><h4>CAIXA</h4><div id="resumoCaixa" class="valor" style="color: var(--accent);">R$ 0,00</div></div>
        <div class="card"><h4>Aplicação</h4><div id="resumoAplicacao" class="valor" style="color: #a855f7;">R$ 0,00</div></div>
    </div>

    <div class="filter-bar">
        <div class="filter-group"><label>DATA INÍCIO</label><input type="date" id="fDataInicio"></div>
        <div class="filter-group"><label>DATA FIM</label><input type="date" id="fDataFim"></div>
        <div class="filter-group">
            <label>STATUS</label>
            <select id="fStatus">
                <option value="">TODOS</option>
                <option value="ABERTO">ABERTO</option>
                <option value="PAGO">PAGO</option>
                <option value="RECEBIDO">RECEBIDO</option>
            </select>
        </div>
        <button onclick="carregarTudo()" class="btn" style="background: var(--accent); color: #020617;">FILTRAR</button>
    </div>

    <div style="margin-bottom: 20px; display: flex; gap: 10px;">
        <button onclick="abrirModal('DEBITO')" class="btn" style="background: #ef4444; color: white;">- Débito (Saída)</button>
        <button onclick="abrirModal('CREDITO')" class="btn" style="background: #22c55e; color: white;">+ Crédito (Entrada)</button>
        <button onclick="abrirModalTransf()" class="btn" style="background: #a855f7; color: white;">Transferência</button>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>BANCO</th>
                    <th>DESCRIÇÃO</th>
                    <th>ENTRADA</th>
                    <th>SAÍDA</th>
                    <th>STATUS</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="listaFinanceiro"></tbody>
        </table>
    </div>
</div>

<div id="modalLancamento" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle" style="color: var(--accent); margin: 0 0 15px 0;">Lançamento</h2>
        <input type="hidden" id="tipoOperacao">
        <label>NF / REFERÊNCIA</label><input type="text" id="mNF">
        <label>DESCRIÇÃO</label><input type="text" id="mDesc">
        <label>VALOR (R$)</label><input type="number" step="0.01" id="mValor">
        <label>VENCIMENTO / PAGAMENTO</label><input type="date" id="mData">
        <label>BANCO</label><select id="mBanco"></select>
        <div style="display: flex; gap: 10px; margin-top: 25px;">
            <button onclick="salvarOperacao()" class="btn" style="background: #22c55e; color: white; flex: 1;">SALVAR</button>
            <button onclick="fecharModal()" class="btn" style="background: #475569; color: white; flex: 1;">CANCELAR</button>
        </div>
    </div>
</div>

<div id="modalTransferencia" class="modal">
    <div class="modal-content" style="border-color: #a855f7;">
        <h2 style="color: #a855f7; margin: 0 0 15px 0;">Transferência</h2>
        <label>ORIGEM (SAÍDA)</label><select id="tOrigem"></select>
        <label>DESTINO (ENTRADA)</label><select id="tDestino"></select>
        <label>VALOR (R$)</label><input type="number" step="0.01" id="tValor">
        <div style="display: flex; gap: 10px; margin-top: 25px;">
            <button onclick="executarTransferencia()" class="btn" style="background: #a855f7; color: white; flex: 1;">TRANSFERIR</button>
            <button onclick="fecharModalTransf()" class="btn" style="background: #475569; color: white; flex: 1;">CANCELAR</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/contas_pagar.js"></script>
</body>
</html>
